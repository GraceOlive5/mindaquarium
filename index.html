<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="마음 어항">
  <title>마음 어항</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    
    /* 물고기별 자연스러운 곡선 움직임 - 직선 제거 */
    @keyframes swim1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(15vw, 8vh) rotate(3deg); }
      30% { transform: translate(28vw, 18vh) rotate(-2deg); }
      45% { transform: translate(35vw, 12vh) rotate(4deg); }
      60% { transform: translate(30vw, 3vh) rotate(-3deg); }
      75% { transform: translate(18vw, 10vh) rotate(2deg); }
      90% { transform: translate(8vw, 5vh) rotate(-2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes swim2 {
      0% { transform: translate(0, 0) rotate(0deg); }
      12% { transform: translate(-12vw, 10vh) rotate(-2deg); }
      25% { transform: translate(-22vw, 8vh) rotate(3deg); }
      38% { transform: translate(-30vw, 15vh) rotate(-3deg); }
      50% { transform: translate(-32vw, 10vh) rotate(2deg); }
      62% { transform: translate(-25vw, 5vh) rotate(-2deg); }
      75% { transform: translate(-15vw, 12vh) rotate(3deg); }
      88% { transform: translate(-8vw, 8vh) rotate(-2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes swim3 {
      0% { transform: translate(0, 0) rotate(0deg); }
      14% { transform: translate(18vw, -8vh) rotate(3deg); }
      28% { transform: translate(32vw, -5vh) rotate(-2deg); }
      42% { transform: translate(38vw, -12vh) rotate(4deg); }
      56% { transform: translate(33vw, -15vh) rotate(-3deg); }
      70% { transform: translate(22vw, -10vh) rotate(2deg); }
      85% { transform: translate(10vw, -6vh) rotate(-2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes swim4 {
      0% { transform: translate(0, 0) rotate(0deg); }
      13% { transform: translate(-15vw, -10vh) rotate(-3deg); }
      26% { transform: translate(-28vw, -8vh) rotate(2deg); }
      39% { transform: translate(-35vw, -15vh) rotate(-4deg); }
      52% { transform: translate(-32vw, -18vh) rotate(3deg); }
      65% { transform: translate(-25vw, -12vh) rotate(-2deg); }
      78% { transform: translate(-18vw, -8vh) rotate(3deg); }
      91% { transform: translate(-10vw, -5vh) rotate(-2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* 모바일용 더 작은 움직임 */
    @media (max-width: 768px) {
      @keyframes swim1 {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(25vw, 10vh) rotate(3deg); }
        40% { transform: translate(40vw, 15vh) rotate(-2deg); }
        60% { transform: translate(35vw, 8vh) rotate(3deg); }
        80% { transform: translate(20vw, 12vh) rotate(-2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes swim2 {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(-20vw, 12vh) rotate(-2deg); }
        40% { transform: translate(-35vw, 10vh) rotate(3deg); }
        60% { transform: translate(-30vw, 15vh) rotate(-3deg); }
        80% { transform: translate(-18vw, 8vh) rotate(2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes swim3 {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(22vw, -10vh) rotate(3deg); }
        40% { transform: translate(38vw, -8vh) rotate(-2deg); }
        60% { transform: translate(32vw, -12vh) rotate(3deg); }
        80% { transform: translate(18vw, -7vh) rotate(-2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes swim4 {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(-20vw, -10vh) rotate(-3deg); }
        40% { transform: translate(-35vw, -12vh) rotate(2deg); }
        60% { transform: translate(-30vw, -15vh) rotate(-3deg); }
        80% { transform: translate(-18vw, -8vh) rotate(2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .animate-spin {
      animation: spin 1s linear infinite;
    }

    @keyframes bubble {
      0% {
        transform: translateY(0) scale(0.9);
        opacity: 0.9;
      }
      50% {
        transform: translateY(-50vh) scale(1.1);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-100vh) scale(1.3);
        opacity: 0;
      }
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(200, 230, 255, 0.6));
      border-radius: 50%;
      animation: bubble linear infinite;
      box-shadow: inset -2px -2px 4px rgba(255, 255, 255, 0.5);
    }

    .fish-swimming {
      cursor: pointer;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
      user-select: none;
    }

    .fish-swimming:hover {
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
      z-index: 20 !important;
    }

    /* 모바일 최적화 */
    @media (max-width: 768px) {
      .fish-swimming {
        width: 280px !important;
        height: 280px !important;
      }
    }

    @media (max-width: 480px) {
      .fish-swimming {
        width: 250px !important;
        height: 250px !important;
      }
    }
  </style>

</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
    
    const firebaseConfig = {
      apiKey: "AIzaSyCQLxHoTcKvS1X7ausB1slF27tZoFvh99o",
      authDomain: "mind-aquarium.firebaseapp.com",
      databaseURL: "https://mind-aquarium-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mind-aquarium",
      storageBucket: "mind-aquarium.firebasestorage.app",
      messagingSenderId: "812802606438",
      appId: "1:812802606438:web:07fef3f1b4f89e78b3f4a7"
    };

    const app = initializeApp(firebaseConfig);
    window.database = getDatabase(app);
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    console.log('🔥 Firebase 연결 완료!');
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Lock = () => <span>🔒</span>;
    const Mail = () => <span>📧</span>;
    const Crown = () => <span>👑</span>;
    const Loader = () => <div className="animate-spin text-4xl">⏳</div>;
    const Heart = () => <span>❤️</span>;

    // 물방울 컴포넌트
    function Bubble({ delay, left, size }) {
      return (
        <div
          className="bubble"
          style={{
            left: `${left}%`,
            width: `${size}px`,
            height: `${size}px`,
            animationDelay: `${delay}s`,
            animationDuration: `${8 + Math.random() * 4}s`
          }}
        />
      );
    }

    // 헤엄치는 물고기 컴포넌트
    function SwimmingFish({ fish, onClick, index }) {
      // 각 물고기마다 고유한 애니메이션
      const animationName = `swim${index + 1}`;
      
      // 물고기별 속도 (모두 조금 느리게, 걱정이는 더 느리게)
      const durations = [16, 14, 15, 18]; // 걱정, 무서움, 화남, 비밀
      const duration = durations[index];
      
      // 네 귀퉁이에서 시작 (모바일도 고려)
      const startPositions = [
        { top: '25%', left: '10%' },   // 좌상단 - 걱정
        { top: '25%', right: '10%' },  // 우상단 - 무서움
        { top: '55%', left: '10%' },   // 중간왼쪽 - 화남
        { top: '55%', right: '10%' }   // 중간오른쪽 - 비밀
      ];

      const position = startPositions[index];

      return (
        <div
          onClick={onClick}
          className="fish-swimming absolute"
          style={{
            ...position,
            animation: `${animationName} ${duration}s ease-in-out infinite`,
            width: 'min(400px, 50vw)',
            height: 'min(400px, 50vw)',
            zIndex: 30
          }}
        >
          <img
            src={fish.image}
            alt={fish.name}
            className="w-full h-full object-contain"
            style={{ 
              userSelect: 'none',
              pointerEvents: 'none'
            }}
          />
        </div>
      );
    }

    function MindAquarium() {
      const [mode, setMode] = useState('intro');
      const [selectedFish, setSelectedFish] = useState(null);
      const [letterContent, setLetterContent] = useState('');
      const [password, setPassword] = useState('');
      const [feedingHistory, setFeedingHistory] = useState({});
      const [messages, setMessages] = useState([]);
      const [parentLetter, setParentLetter] = useState('');
      const [kingLetterContent, setKingLetterContent] = useState('');
      const [hasReadKingLetter, setHasReadKingLetter] = useState(false);
      const [loading, setLoading] = useState(false);
      const [firebaseConnected, setFirebaseConnected] = useState(false);

      const fishes = [
        { id: 'worry', name: '걱정', image: 'mindaquarium_worry.png' },
        { id: 'fear', name: '무서움', image: 'mindaquarium_fear.png' },
        { id: 'anger', name: '화남', image: 'mindaquarium_angry.png' },
        { id: 'secret', name: '비밀', image: 'mindaquarium_secret.png' }
      ];

      useEffect(() => {
        if (!window.database) return;
        setFirebaseConnected(true);

        try {
          const messagesRef = window.dbRef(window.database, 'messages');
          window.dbOnValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const messagesArray = Array.isArray(data) ? data : Object.values(data);
              setMessages(messagesArray.filter(m => m && m.id));
            } else {
              setMessages([]);
            }
          });

          const historyRef = window.dbRef(window.database, 'feedingHistory');
          window.dbOnValue(historyRef, (snapshot) => {
            const data = snapshot.val();
            if (data) setFeedingHistory(data);
          });

          const kingLetterRef = window.dbRef(window.database, 'kingLetter');
          window.dbOnValue(kingLetterRef, (snapshot) => {
            const data = snapshot.val();
            if (data) setKingLetterContent(data);
          });

          const readStatusRef = window.dbRef(window.database, 'hasReadKingLetter');
          window.dbOnValue(readStatusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) setHasReadKingLetter(data);
          });
        } catch (error) {
          console.error('Firebase 연결 오류:', error);
        }
      }, []);

      const saveToFirebase = async (path, data) => {
        setLoading(true);
        try {
          const dataRef = window.dbRef(window.database, path);
          await window.dbSet(dataRef, data);
          await new Promise(resolve => setTimeout(resolve, 300));
        } catch (error) {
          console.error('저장 실패:', error);
          alert('저장에 실패했습니다.');
        } finally {
          setLoading(false);
        }
      };

      const getTodayString = () => new Date().toISOString().split('T')[0];

      const getTotalDays = () => {
        return Object.keys(feedingHistory).length;
      };

      const feedFish = async () => {
        if (!letterContent.trim()) {
          alert('편지를 써주세요!');
          return;
        }

        const today = getTodayString();
        const newMessage = {
          id: Date.now(),
          fish: selectedFish.name,
          content: letterContent,
          date: new Date().toLocaleString('ko-KR')
        };

        const updatedMessages = [...messages, newMessage];
        const updatedHistory = { ...feedingHistory, [today]: true };

        await saveToFirebase('messages', updatedMessages);
        await saveToFirebase('feedingHistory', updatedHistory);

        setMessages(updatedMessages);
        setFeedingHistory(updatedHistory);
        setLetterContent('');
        setMode('aquarium');
        
        const totalDays = Object.keys(updatedHistory).length;
        if (totalDays >= 30 && kingLetterContent && !hasReadKingLetter) {
          setTimeout(() => alert('🎉 물고기 왕이 편지를 보냈어요!'), 500);
        }
      };

      const handleAdminLogin = () => {
        if (password === '1234') {
          setMode('admin');
          setPassword('');
        } else {
          alert('비밀번호가 틀렸습니다.');
          setPassword('');
        }
      };

      const saveKingLetter = async () => {
        if (!parentLetter.trim()) {
          alert('편지 내용을 입력해주세요.');
          return;
        }
        await saveToFirebase('kingLetter', parentLetter);
        setKingLetterContent(parentLetter);
        alert('물고기 왕의 편지가 저장되었습니다!');
        setParentLetter('');
      };

      const readKingLetter = async () => {
        setMode('kingLetter');
        setHasReadKingLetter(true);
        await saveToFirebase('hasReadKingLetter', true);
      };

      if (loading) {
        return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div className="bg-white rounded-lg p-8 flex flex-col items-center">
              <Loader />
              <p className="text-lg font-bold mt-4">저장하는 중...</p>
            </div>
          </div>
        );
      }

      if (mode === 'intro') {
        return (
          <div className="min-h-screen bg-gradient-to-b from-blue-200 to-blue-400 flex flex-col items-center justify-center p-6">
            <div className="text-center mb-12">
              <h1 className="text-5xl font-bold text-white mb-4">🐠 마음 어항 🐠</h1>
              <p className="text-xl text-white mb-2">물고기들에게 마음을 나눠주세요</p>
              {firebaseConnected && (
                <p className="text-sm text-white/80">🔥 클라우드 연결됨</p>
              )}
            </div>
            
            <button
              onClick={() => setMode('aquarium')}
              className="bg-white text-blue-600 px-12 py-6 rounded-full text-2xl font-bold shadow-lg hover:bg-blue-50 transition mb-6"
            >
              어항 들어가기
            </button>
            
            <button
              onClick={() => setMode('adminLogin')}
              className="text-white opacity-50 hover:opacity-100 transition flex items-center gap-2"
            >
              <Lock />
              <span className="text-sm">관리자 모드</span>
            </button>
          </div>
        );
      }

      if (mode === 'adminLogin') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-6">
            <div className="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
              <h2 className="text-2xl font-bold mb-6 text-center">관리자 모드</h2>
              {firebaseConnected && (
                <p className="text-sm text-green-600 text-center mb-4">🔥 클라우드 연결됨</p>
              )}
              <input
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                placeholder="비밀번호 입력"
                className="w-full border-2 border-gray-300 rounded-lg p-3 mb-4"
              />
              <button
                onClick={handleAdminLogin}
                className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition mb-3"
              >
                로그인
              </button>
              <button
                onClick={() => setMode('intro')}
                className="w-full bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition"
              >
                돌아가기
              </button>
            </div>
          </div>
        );
      }

      if (mode === 'admin') {
        return (
          <div className="min-h-screen bg-gray-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="flex justify-between items-center mb-6">
                <div>
                  <h2 className="text-3xl font-bold">관리자 모드</h2>
                  {firebaseConnected && (
                    <p className="text-sm text-green-600">🔥 실시간 동기화 중</p>
                  )}
                </div>
                <button
                  onClick={() => setMode('intro')}
                  className="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600"
                >
                  나가기
                </button>
              </div>

              <div className="bg-yellow-50 border-2 border-yellow-300 rounded-lg p-6 mb-6">
                <div className="flex items-center gap-2 mb-4">
                  <Crown />
                  <h3 className="text-xl font-bold">물고기 왕의 편지 (30일 달성 시 표시)</h3>
                </div>
                <textarea
                  value={parentLetter}
                  onChange={(e) => setParentLetter(e.target.value)}
                  placeholder="아이에게 보낼 격려의 편지를 작성하세요..."
                  className="w-full border-2 border-gray-300 rounded-lg p-3 mb-3 h-32"
                  maxLength={300}
                />
                <div className="flex justify-between items-center">
                  <span className="text-sm text-gray-600">{parentLetter.length}/300자</span>
                  <button
                    onClick={saveKingLetter}
                    className="bg-yellow-500 text-white px-6 py-2 rounded-lg font-bold hover:bg-yellow-600"
                  >
                    편지 저장
                  </button>
                </div>
                {kingLetterContent && (
                  <div className="mt-4 p-4 bg-white rounded-lg border border-yellow-300">
                    <p className="text-sm font-bold mb-2">현재 저장된 편지:</p>
                    <p className="text-gray-700 whitespace-pre-wrap">{kingLetterContent}</p>
                  </div>
                )}
              </div>

              <div className="bg-white rounded-lg shadow-lg p-6">
                <h3 className="text-2xl font-bold mb-4 flex items-center gap-2">
                  <Mail />
                  수신 편지함 ({messages.length}개)
                </h3>
                
                {messages.length === 0 ? (
                  <p className="text-gray-500 text-center py-8">아직 받은 편지가 없습니다.</p>
                ) : (
                  <div className="space-y-4">
                    {messages.slice().reverse().map((msg) => (
                      <div key={msg.id} className="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-300 transition">
                        <div className="flex justify-between items-start mb-2">
                          <span className="font-bold text-lg">{msg.fish} 물고기</span>
                          <span className="text-sm text-gray-500">{msg.date}</span>
                        </div>
                        <p className="text-gray-700 whitespace-pre-wrap">{msg.content}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (mode === 'letter' && selectedFish) {
        return (
          <div className="min-h-screen bg-gradient-to-b from-blue-200 to-blue-400 p-6">
            <div className="max-w-2xl mx-auto">
              <div className="bg-white rounded-lg shadow-xl p-8">
                <h2 className="text-3xl font-bold mb-4 text-center">
                  {selectedFish.name} 물고기에게 먹이 주기
                </h2>
                <div className="flex justify-center mb-6">
                  <img 
                    src={selectedFish.image} 
                    alt={selectedFish.name}
                    className="w-64 h-64 object-contain"
                  />
                </div>
                <p className="text-gray-600 text-center mb-6">
                  오늘의 마음을 편지로 써보세요
                </p>
                
                <textarea
                  value={letterContent}
                  onChange={(e) => setLetterContent(e.target.value)}
                  placeholder={`${selectedFish.name} 물고기에게 하고 싶은 이야기를 써주세요...`}
                  className="w-full border-2 border-gray-300 rounded-lg p-4 mb-4 h-48 text-lg"
                  maxLength={100}
                />
                
                <div className="text-right text-sm text-gray-600 mb-4">
                  {letterContent.length}/100자
                </div>
                
                <div className="flex gap-4">
                  <button
                    onClick={() => {
                      setMode('aquarium');
                      setLetterContent('');
                    }}
                    className="flex-1 bg-gray-300 text-gray-700 py-4 rounded-lg font-bold hover:bg-gray-400 transition"
                  >
                    취소
                  </button>
                  <button
                    onClick={feedFish}
                    className="flex-1 bg-blue-600 text-white py-4 rounded-lg font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2"
                  >
                    <Heart />
                    먹이 주기
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (mode === 'kingLetter') {
        return (
          <div className="min-h-screen bg-gradient-to-b from-yellow-200 to-yellow-400 p-6">
            <div className="max-w-2xl mx-auto">
              <div className="bg-white rounded-lg shadow-xl p-8">
                <div className="text-center mb-6">
                  <div className="text-6xl mb-4"><Crown /></div>
                  <h2 className="text-3xl font-bold mb-2">물고기 왕의 편지</h2>
                  <p className="text-gray-600">30일 동안 물고기들을 돌봐줘서 고마워요!</p>
                </div>
                
                <div className="bg-yellow-50 border-2 border-yellow-300 rounded-lg p-6 mb-6">
                  <p className="text-lg whitespace-pre-wrap leading-relaxed">
                    {kingLetterContent}
                  </p>
                </div>
                
                <button
                  onClick={() => setMode('aquarium')}
                  className="w-full bg-blue-600 text-white py-4 rounded-lg font-bold hover:bg-blue-700 transition"
                >
                  어항으로 돌아가기
                </button>
              </div>
            </div>
          </div>
        );
      }

      // 어항 메인 화면
      const totalDays = getTotalDays();
      const canShowKingLetter = totalDays >= 30 && kingLetterContent && !hasReadKingLetter;

      return (
        <div className="relative min-h-screen bg-gradient-to-b from-blue-400 via-blue-500 to-blue-600 overflow-hidden">
          {/* 물방울들 */}
          {Array.from({ length: 25 }).map((_, i) => (
            <Bubble 
              key={i} 
              delay={i * 0.8} 
              left={Math.random() * 100}
              size={15 + Math.random() * 25}
            />
          ))}

          {/* 상단 정보 - 모바일 최적화 */}
          <div className="relative z-20 text-center pt-4 pb-2">
            <h1 className="text-3xl font-bold text-white mb-2 drop-shadow-lg">🐠 마음 어항 🐠</h1>
            
            <div className="bg-white/90 rounded-lg p-3 inline-block mx-auto max-w-xs">
              <p className="text-xs text-gray-600 mb-1">물고기에게 먹이 준 날</p>
              <div className="flex gap-1 justify-center mb-1 flex-wrap">
                {Array.from({ length: 30 }).map((_, i) => (
                  <div
                    key={i}
                    className={`w-2.5 h-2.5 rounded-full ${
                      i < totalDays ? 'bg-blue-500' : 'bg-gray-300'
                    }`}
                  />
                ))}
              </div>
              <p className="text-xl font-bold text-blue-600">{totalDays} / 30일</p>
            </div>
          </div>

          {/* 왕 편지 알림 */}
          {canShowKingLetter && (
            <div className="relative z-20 px-6 mb-4">
              <button
                onClick={readKingLetter}
                className="w-full max-w-2xl mx-auto block bg-yellow-400 text-gray-800 py-6 rounded-lg font-bold text-xl hover:bg-yellow-500 transition flex items-center justify-center gap-3 animate-pulse shadow-xl"
              >
                <Crown />
                <span>물고기 왕이 편지를 보냈어요! 📬</span>
              </button>
            </div>
          )}

          {/* 헤엄치는 물고기들 */}
          <div className="relative w-full h-screen">
            {fishes.map((fish, index) => (
              <SwimmingFish
                key={fish.id}
                fish={fish}
                index={index}
                onClick={() => {
                  setSelectedFish(fish);
                  setMode('letter');
                }}
              />
            ))}
          </div>

          {/* 하단 버튼 */}
          <div className="fixed bottom-8 left-0 right-0 z-20 text-center">
            <button
              onClick={() => setMode('intro')}
              className="bg-white/90 text-blue-600 px-6 py-3 rounded-full font-bold hover:bg-white transition shadow-lg"
            >
              처음으로 돌아가기
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MindAquarium />);
  </script>

</body>
</html>
