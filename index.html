<script type="text/babel">
const { useState, useEffect, useRef } = React;

const DEFAULT_FISHES = [
  { id:'worry',  defaultName:'걱정',    color:'노란색', image:'mindaquarium_worry.png' },
  { id:'fear',   defaultName:'무서움',  color:'파란색', image:'mindaquarium_fear.png' },

  { id:'shy',    defaultName:'부끄러움',color:'핑크색', image:'mindaquarium_shy.png' },

/* ── 공통 컴포넌트 ── */
function Bubble({ delay, left, size }) {
  return <div className="bubble" style={{ left:`${left}%`, width:`${size}px`, height:`${size}px`, animationDelay:`${delay}s`, animationDuration:`${8+Math.random()*4}s` }} />;
}

function Bubbles({ n=25 }) {
  return Array.from({length:n}).map((_,i) =>
    <Bubble key={i} delay={i*0.8} left={Math.random()*100} size={15+Math.random()*25} />
  );
}

function SwimmingFish({ fish, onClick, index }) {
  const [dir, setDir] = useState(1);
  const ref = useRef(null);
  const durations = [18,15,20,17,14,19,16];
  const starts = [
    {top:'15%',left:'10%'},{top:'15%',right:'10%'},{top:'30%',left:'50%'},
    {top:'45%',left:'15%'},{top:'45%',right:'15%'},{top:'60%',left:'35%'},{top:'60%',right:'30%'}
  ];
  useEffect(() => {
    const id = setInterval(() => {
      if (!ref.current) return;
      const r = ref.current.getBoundingClientRect();
      if (r.left <= 0) setDir(1);
      else if (r.right >= window.innerWidth) setDir(-1);
    }, 100);
    return () => clearInterval(id);
  }, []);
  return (
    <div ref={ref} className="fish-swimming absolute" style={{
      ...starts[index], animation:`swim${index+1} ${durations[index]}s ease-in-out infinite`,
      width:'min(120px,25vw)', height:'min(120px,25vw)', zIndex:30
    }}>
      <div style={{ transform:`scaleX(${dir})`, width:'100%', height:'100%', position:'relative' }}>
        <div className="fish-click-area" onClick={onClick} />
        <img src={fish.image} alt={fish.name} style={{userSelect:'none'}} />
        <div className="absolute pointer-events-none" style={{
          bottom: '-10px',
          left: '50%',
          transform: `translateX(-50%) scaleX(${dir})`,
          whiteSpace: 'nowrap'
        }}>
          <span style={{
            display: 'inline-block',
            background: 'rgba(255,255,255,0.92)',
            color: '#333',
            fontSize: '13px',
            fontWeight: 700,
            padding: '3px 10px',
            borderRadius: '20px',
            boxShadow: '0 2px 6px rgba(0,0,0,0.25)',
            border: '1.5px solid rgba(255,255,255,0.8)',
            letterSpacing: '0.02em'
          }}>
            {fish.name}
          </span>
        </div>
      </div>
    </div>
  );
}

/* ── AdminSection: 독립 컴포넌트, 절대 다른 함수 안에 정의하지 않음 ── */
function AdminSection({ title, badge, children, defaultOpen=true }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="sec-card">
      <button className="sec-head" onClick={() => setOpen(v => !v)}>
        <span style={{ fontWeight:600, fontSize:'15px', color:'#111827' }}>
          {title}{badge != null && <span className="badge">{badge}</span>}
        </span>
        <span className="sec-arrow" style={{ transform: open ? 'rotate(0deg)' : 'rotate(180deg)' }}>▲</span>
      </button>
      {open && <div className="sec-body">{children}</div>}
    </div>
  );
}

/* ── FishNameEditor: 독립 컴포넌트 ── */
function FishNameEditor({ customFishNames, onSave }) {
  const [names, setNames] = useState({});
  useEffect(() => { if (customFishNames) setNames(customFishNames); }, [customFishNames]);
  const change = (id, v) => { if (v.length <= 4) setNames(n => ({...n, [id]:v})); };
  return (
    <div>
      <p style={{ fontSize:'13px', color:'#9ca3af', marginBottom:'12px' }}>각 물고기 이름을 최대 4글자로 설정하세요.</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
        {DEFAULT_FISHES.map(f => (
          <div key={f.id} style={{ border:'1px solid #e5e7eb', borderRadius:'8px', padding:'10px', display:'flex', alignItems:'center', gap:'10px' }}>
            <img src={f.image} alt={f.color} style={{ width:'44px', height:'44px', objectFit:'contain' }} />
            <div style={{ flex:1 }}>
              <p style={{ fontSize:'11px', color:'#9ca3af', margin:'0 0 3px' }}>{f.color}</p>
              <input type="text" maxLength={4}
                value={names[f.id] !== undefined ? names[f.id] : f.defaultName}
                onChange={e => change(f.id, e.target.value)}
                className="a-input" style={{ padding:'5px 8px', fontSize:'14px', fontWeight:600 }} />
              <p style={{ fontSize:'10px', color:'#d1d5db', margin:'2px 0 0' }}>
                {(names[f.id] !== undefined ? names[f.id] : f.defaultName).length}/4
              </p>
            </div>
          </div>
        ))}
      </div>
      <div style={{ display:'flex', gap:'8px' }}>
        <button onClick={() => onSave(names)} className="a-btn btn-blue" style={{ flex:1 }}>이름 저장</button>
        <button onClick={() => { setNames({}); onSave({}); }} className="a-btn btn-gray">기본값으로</button>
      </div>
    </div>
  );
}

function AuthScreen({ onSuccess }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [childName, setChildName] = useState('');
  const [busy, setBusy] = useState(false);

  const signIn = async () => {
    if (!email||!password) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
    setBusy(true);
    try {
      await fa().signInWithEmailAndPassword(auth(), email, password);
      onSuccess();
    } catch(e) {
      alert(e.code==='auth/user-not-found'||e.code==='auth/wrong-password' ? '이메일 또는 비밀번호가 잘못되었습니다.' : '로그인 실패: '+e.message);
    } finally { setBusy(false); }
  };

  const signUp = async () => {
    if (!email||!password) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
    if (password !== confirm) { alert('비밀번호가 일치하지 않습니다.'); return; }
    if (password.length < 6) { alert('비밀번호는 6자 이상이어야 합니다.'); return; }
    if (!childName) { alert('아이 이름을 입력해주세요.'); return; }
    setBusy(true);
    try {
      const cred = await fa().createUserWithEmailAndPassword(auth(), email, password);
      await fa().set(fa().ref(db(), `users/${cred.user.uid}/profile`), { email, childName, createdAt: new Date().toISOString() });
      await fa().set(fa().ref(db(), `users/${cred.user.uid}/adminPassword`), '1234');
      alert('회원가입 완료!');
      onSuccess();
    } catch(e) {
      alert(e.code==='auth/email-already-in-use'?'이미 사용 중인 이메일입니다.':'회원가입 실패: '+e.message);
    } finally { setBusy(false); }
  };

  const googleSignIn = async () => {
    setBusy(true);
    try {
      const GAP = window._GoogleAuthProvider;
      const provider = new GAP();
      const result = await fa().signInWithPopup(auth(), provider);
      const uid = result.user.uid;
      const snap = await new Promise(r => fa().onValue(fa().ref(db(),`users/${uid}/profile`), r, {onlyOnce:true}));
      if (!snap.val()) {

/* ══════════════════════════════════════
   튜토리얼 화면 (레트로 다마고치 스타일)
══════════════════════════════════════ */
function TypeWriter({ text, speed=40, onDone }) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  useEffect(() => {
    setDisplayed('');
    setDone(false);
    let i = 0;
    const id = setInterval(() => {
      i++;
      setDisplayed(text.slice(0, i));
      if (i >= text.length) { clearInterval(id); setDone(true); if(onDone) onDone(); }
    }, speed);
    return () => clearInterval(id);
  }, [text]);
  return <span>{displayed}{!done && <span className="cursor-blink" />}</span>;
}

  useEffect(() => {
    if (scene === 5) setTimeout(() => setCounterPop(true), 400);
  }, [scene]);

  const SCENES = {
    1: {
      msg: `안녕! 나는 마음을 먹고 자라는 물고기야.\n너의 이름을 알려줄래?`,
    },
    2: {
      msg: `반가워, ${childName}야!\n우리 어항엔 친구들이 많은데\n우리에게 마음을 나눠줄\n주인이 필요해.\n\n기쁜 일, 슬픈 일,\n어쩌면 지루한 날이라도\n마음을 나눠줄 수 있을까?`,
    },
    3: {
      msg: showBadge
        ? `부끄러운 마음이 들었다면\n이렇게 '부끄러움'이라고\n써있는 나를 선택하는 거야!`
        : '',
    },
    4: {
      msg: `지금 생각나는\n부끄러웠던 마음을\n한번 적어볼래?`,
    },
    5: {
      msg: `고마워! 정말 든든하다!\n네가 나눠준 마음은\n저기에 차곡차곡 쌓일 거야.`,
    },
    6: {
      msg: `마음을 많이 나눠준다면\n우리 물고기 왕이\n깜짝 편지를 보내기도 해!\n잘 관찰해봐.\n\n앞으로도 잘 부탁해~!`,
    },
  };

  const fishClass = spinning ? 'tut-fish-spin' : 'tut-fish-bounce';

  return (
    <div className="fixed inset-0 overflow-hidden"
      style={{ backgroundImage:'url(mindaquarium_bg.png)', backgroundSize:'cover', backgroundPosition:'center' }}>
      <Bubbles n={20} />

      <div className="relative z-10 h-full flex flex-col items-center justify-center px-4" style={{ gap:'0' }}>

        {/* 물고기 영역 */}
        <div style={{ marginBottom:'24px', position:'relative', display:'flex', flexDirection:'column', alignItems:'center' }}>

          {/* 씬 6: 실루엣 왕 물고기 */}
          {scene === 6 && (
            <img src="mindaquarium_happy.png" alt="왕의 물고기"
              className="tut-silhouette"
              style={{ width:'80px', height:'80px', objectFit:'contain', position:'absolute', top:'-70px', left:'50%', transform:'translateX(-50%)' }} />
          )}

          {/* 메인 물고기 (부끄러움) */}
          <div style={{ position:'relative' }}>
            <img src={shyFish.image} alt="부끄러움 물고기"
              className={fishClass}
              style={{ width:'min(140px,32vw)', height:'min(140px,32vw)', objectFit:'contain',
                filter:'drop-shadow(0 8px 24px rgba(0,0,0,0.4))',
                transformOrigin: 'center center' }} />

            {/* 씬 3: 이름 배지 */}
            {scene === 3 && showBadge && (
              <div className="tut-pop-in retro" style={{
                position:'absolute', top:'50%', left:'50%',
                transform:'translate(-50%,-50%)',
                background:'rgba(10,10,30,0.9)',
                border:'3px solid #f9a8d4',
                borderRadius:'4px',
                padding:'6px 12px',
                color:'#f9a8d4',
                fontSize:'10px',
                whiteSpace:'nowrap',
                boxShadow:'3px 3px 0 #1a1a2e'
              }}>
                {shyFish.name}
              </div>
            )}

            {/* 씬 5: 카운터 강조 */}
            {scene === 5 && (
              <div className={`retro ${counterPop ? 'tut-counter-pop' : ''}`} style={{
                position:'absolute', top:'-30px', right:'-30px',
                background:'#38bdf8', color:'#1a1a2e',
                border:'3px solid #fff',
                boxShadow:'3px 3px 0 #1a1a2e',
                borderRadius:'4px',
                padding:'6px 10px',
                fontSize:'14px',
                fontWeight:700
              }}>1</div>
            )}
          </div>
        </div>

        {/* 말풍선 */}
        {scene !== 4 && SCENES[scene]?.msg && (
          <div className="pixel-box tut-pop-in" key={`box-${scene}-${showBadge}`}
            style={{ maxWidth:'360px', width:'100%', padding:'20px 22px', marginBottom:'20px' }}>
            <p className="retro" style={{ color:'#fff', fontSize:'9px', lineHeight:'2', whiteSpace:'pre-line', margin:0 }}>
              <TypeWriter key={`tw-${scene}-${showBadge}`}
                text={SCENES[scene].msg}
                speed={45}
                onDone={() => setMsgDone(true)} />
            </p>
          </div>
        )}

        {/* 씬 4: 편지 쓰기 */}
        {scene === 4 && (
          <div className="pixel-box tut-pop-in" style={{ maxWidth:'360px', width:'100%', padding:'20px', marginBottom:'20px' }}>
            <p className="retro" style={{ color:'#f9a8d4', fontSize:'9px', lineHeight:'2', marginBottom:'14px' }}>
              <TypeWriter key="tw-4" text={SCENES[4].msg} speed={45} onDone={() => setMsgDone(true)} />
            </p>
            <textarea
              value={letterText}
              onChange={e => setLetterText(e.target.value)}
              placeholder="마음을 적어봐..."
              maxLength={100}
              rows={4}
              className="pixel-textarea"
            />
            <p style={{ color:'rgba(255,255,255,0.4)', fontSize:'10px', textAlign:'right', marginTop:'4px', fontFamily:'monospace' }}>
              {letterText.length}/100
            </p>
          </div>
        )}

        {/* 씬 1: 이름 입력 */}
        {scene === 1 && msgDone && (
          <div className="tut-pop-in" style={{ maxWidth:'360px', width:'100%', marginBottom:'16px' }}>
            <input
              type="text" maxLength={6}
              value={childName}
              onChange={e => setChildName(e.target.value)}
              onKeyPress={e => e.key === 'Enter' && childName.trim() && goNext(2)}
              placeholder="이름을 입력해봐"
              className="pixel-input"
            />
          </div>
        )}

        {/* 액션 버튼 */}
        <div className="tut-pop-in" style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'10px' }}>
          {scene === 1 && msgDone && (
            <button className="pixel-btn pixel-btn-blue"
              onClick={() => childName.trim() && goNext(2)}
              disabled={!childName.trim()}>
              ▶ 다음
            </button>
          )}
          {scene === 2 && msgDone && (
            <button className="pixel-btn"
              onClick={() => goNext(3)}>
              ▶ 그래 좋아! 어떻게 하는건데?
            </button>
          )}
          {scene === 3 && showBadge && msgDone && (
            <button className="pixel-btn pixel-btn-blue"
              onClick={() => goNext(4)}>
              ▶ 해볼게!
            </button>
          )}
          {scene === 4 && msgDone && (
            <button className="pixel-btn pixel-btn-green"
              onClick={async () => {
                if (!letterText.trim()) return;
                await onSendLetter(letterText, shyFish.name);
                goNext(5);
              }}
              disabled={!letterText.trim()}>
              ❤️ 먹이 주기
            </button>
          )}
          {scene === 5 && msgDone && (
            <button className="pixel-btn pixel-btn-blue"
              onClick={() => goNext(6)}>
              ▶ 다음
            </button>
          )}
          {scene === 6 && msgDone && (
            <button className="pixel-btn pixel-btn-green"
              onClick={onComplete}>
              ▶ 앞으로 잘 부탁해~! 🐟
            </button>
          )}
        </div>

      </div>
    </div>
  );
}


function AquariumScreen({ fishes, cycleCount, goalCount, pendingKingLetter, messages, onFishClick, onReadKingLetter, onBack }) {
  const [showPopup, setShowPopup] = useState(false);

  useEffect(() => {
    if (cycleCount >= goalCount && pendingKingLetter) {
      const t = setTimeout(() => setShowPopup(true), 600);
      return () => clearTimeout(t);
    }
  }, [cycleCount, goalCount, pendingKingLetter]);

  return (
    <div className="relative min-h-screen overflow-hidden"
      style={{ backgroundImage:'url(mindaquarium_bg.png)', backgroundSize:'cover', backgroundPosition:'center' }}>
      <Bubbles n={25} />

      {/* 왕의 편지 팝업 */}
      {showPopup && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6"
          style={{ background:'rgba(0,0,0,0.6)' }}>
          <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center">
            <div className="text-5xl mb-3">👑</div>
            <h3 className="text-2xl font-bold mb-2">물고기 왕이 편지를 보냈어요!</h3>
            <p className="text-gray-500 text-sm mb-6">마음을 {goalCount}번 나눠줬어요 🎉</p>
            <button onClick={() => { setShowPopup(false); onReadKingLetter(); }}
              className="w-full bg-yellow-400 text-gray-800 py-3 rounded-xl font-bold text-lg hover:bg-yellow-500 transition mb-3">
              편지 읽기 💌
            </button>
            <button onClick={() => setShowPopup(false)}
              className="w-full text-gray-400 text-sm hover:text-gray-600 transition">
              나중에 읽기
            </button>
          </div>
        </div>
      )}

      <div className="relative z-20 text-center pt-4 pb-2">
        <div style={{
          display: 'inline-block',
          background: 'rgba(255,255,255,0.92)',
          borderRadius: '20px',
          padding: '10px 24px 12px',
          boxShadow: '0 4px 16px rgba(0,0,0,0.12)',
          minWidth: '140px'
        }}>
          <p style={{ fontSize: '11px', color: '#6b7280', marginBottom: '2px', fontWeight: 500 }}>
            물고기에게 나눠준 마음의 기록
          </p>
          <p key={messages.length} className="count-pop" style={{
            fontSize: '36px',
            fontWeight: 800,
            color: '#38bdf8',
            lineHeight: 1.2,
            margin: 0
          }}>
            {messages.length}<span style={{ fontSize: '18px', fontWeight: 700, marginLeft: '2px' }}>번</span>
          </p>
        </div>
      </div>

      {cycleCount >= goalCount && pendingKingLetter && !showPopup && (
        <div className="relative z-20 px-6 mb-4">
          <button onClick={onReadKingLetter}
            className="w-full max-w-2xl mx-auto block bg-yellow-400 text-gray-800 py-4 rounded-lg font-bold text-lg hover:bg-yellow-500 transition flex items-center justify-center gap-3 animate-pulse shadow-xl">
            👑 <span>물고기 왕이 편지를 보냈어요! 📬</span>
          </button>
        </div>
      )}

      <div className="relative w-full h-screen">
        {fishes.map((fish, i) =>
          <SwimmingFish key={fish.id} fish={fish} index={i} onClick={() => onFishClick(fish)} />
        )}
      </div>
      <div className="fixed top-6 left-6 z-20">
        <button onClick={onBack} className="bg-white/90 text-blue-600 px-4 py-2 rounded-lg font-bold hover:bg-white transition shadow-lg text-sm">
          ← 처음으로
        </button>
      </div>
      <div className="fixed bottom-8 left-0 right-0 z-10 text-center pointer-events-none">
        <p className="text-white/50 text-xs">© 2024 hhappyfamilydais</p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   앱 루트: mode state + Firebase만 관리
══════════════════════════════════════ */
function App() {
  const [mode, setMode] = useState('loading');
  const [user, setUser] = useState(null);
  const [saving, setSaving] = useState(false);
  const [firebaseConnected, setFirebaseConnected] = useState(false);

  const [messages, setMessages] = useState([]);
  const [feedingHistory, setFeedingHistory] = useState({});
  const [goalCount, setGoalCount] = useState(30);
  const [pendingKingLetter, setPendingKingLetter] = useState('');
  const [kingLetterHistory, setKingLetterHistory] = useState([]);
  const [adminPassword, setAdminPassword] = useState('1234');
  const [customFishNames, setCustomFishNames] = useState(null);
  const [selectedFish, setSelectedFish] = useState(null);
  const [kingLetterToShow, setKingLetterToShow] = useState('');
  const [tutorialDone, setTutorialDone] = useState(null); // null=로딩중

  // cycleCount: 발송된 편지 수 * goalCount 이후 나머지로 계산
  const sentCount = kingLetterHistory.length;
  const cycleCount = messages.length - (sentCount * goalCount);

  const fishes = DEFAULT_FISHES.map(f => ({ ...f, name: customFishNames?.[f.id] || f.defaultName }));

  useEffect(() => {
    fa().onAuthStateChanged(auth(), u => {
      setUser(u);
      if (!u) setMode('auth');
      // 로그인 시엔 loading 유지 — tutorialDone 확인 후 mode 결정
    });
  }, []);

  useEffect(() => {
    if (!user) return;
    setFirebaseConnected(true);
    const listen = (path, cb) => fa().onValue(fa().ref(db(), `users/${user.uid}/${path}`), snap => {
      const d = snap.val();
      if (d !== null && d !== undefined) cb(d);
    });
    listen('messages', d => setMessages(Array.isArray(d) ? d.filter(m=>m&&m.id) : Object.values(d).filter(m=>m&&m.id)));
    listen('feedingHistory', setFeedingHistory);
    listen('goalCount', setGoalCount);
    listen('pendingKingLetter', setPendingKingLetter);
    listen('kingLetterHistory', d => {
      if (Array.isArray(d)) setKingLetterHistory(d.filter(Boolean));
      else setKingLetterHistory(Object.values(d).filter(Boolean));
    });
    listen('adminPassword', setAdminPassword);
    listen('customFishNames', setCustomFishNames);

    // 튜토리얼 완료 여부 확인 후 mode 결정
    fa().onValue(fa().ref(db(), `users/${user.uid}/tutorialDone`), snap => {
      const done = !!snap.val();
      setTutorialDone(done);
      setMode(done ? 'intro' : 'tutorial');
    }, { onlyOnce: true });

    // ── 마이그레이션: 구버전 kingLetter → 새 구조로 한 번만 실행 ──
    fa().onValue(fa().ref(db(), `users/${user.uid}/v2migrated`), snap => {
      if (snap.val()) return;
      const uid = user.uid;
      Promise.all([
        new Promise(r => fa().onValue(fa().ref(db(), `users/${uid}/kingLetter`),         s => r(s.val()), { onlyOnce:true })),
        new Promise(r => fa().onValue(fa().ref(db(), `users/${uid}/hasReadKingLetter`),  s => r(s.val()), { onlyOnce:true })),
      ]).then(([oldKingLetter, hasRead]) => {
        const updates = { v2migrated: true };
        if (oldKingLetter) {
          if (hasRead) {
            updates['kingLetterHistory'] = [{ content: oldKingLetter, sentAt: '(이전 기록)' }];
            updates['pendingKingLetter'] = '';
          } else {
            updates['pendingKingLetter'] = oldKingLetter;
          }
        }
        Object.entries(updates).forEach(([k, v]) =>
          fa().set(fa().ref(db(), `users/${uid}/${k}`), v)
        );
        if (updates['pendingKingLetter'] !== undefined) setPendingKingLetter(updates['pendingKingLetter']);
      });
    }, { onlyOnce: true });
  }, [user]);

  const saveToFirebase = async (path, data) => {
    if (!user) return;
    setSaving(true);
    try {
      await fa().set(fa().ref(db(), `users/${user.uid}/${path}`), data);
      await new Promise(r => setTimeout(r, 200));
    } catch(e) { alert('저장 실패: '+e.message); }
    finally { setSaving(false); }
  };

  const signOut = async () => {
    if (!confirm('로그아웃 하시겠습니까?')) return;
    await fa().signOut(auth());
    setMessages([]); setFeedingHistory({});
    setPendingKingLetter(''); setKingLetterHistory([]);
    setCustomFishNames(null);
    setMode('auth');
  };

  const completeTutorial = async () => {
    await saveToFirebase('tutorialDone', true);
    setTutorialDone(true);
    setMode('intro');
  };

  const sendTutorialLetter = async (text, fishName) => {
    const updated = [...messages, {
      id: Date.now(),
      fish: fishName,
      content: text,
      date: new Date().toLocaleString('ko-KR')
    }];
    const today = new Date().toISOString().split('T')[0];
    const updatedHistory = { ...feedingHistory, [today]: true };
    await saveToFirebase('messages', updated);
    await saveToFirebase('feedingHistory', updatedHistory);
    setMessages(updated);
    setFeedingHistory(updatedHistory);
  };

  const handleAdminLogin = (pw) => {
    if (pw === adminPassword) setMode('admin');
    else alert('비밀번호가 틀렸습니다.');
  };

  const feedFish = async (text) => {
    const updated = [...messages, { id:Date.now(), fish:selectedFish.name, content:text, date:new Date().toLocaleString('ko-KR') }];
    const today = new Date().toISOString().split('T')[0];
    const updatedHistory = { ...feedingHistory, [today]: true };

    await saveToFirebase('messages', updated);
    await saveToFirebase('feedingHistory', updatedHistory);
    setMessages(updated);
    setFeedingHistory(updatedHistory);
    setMode('aquarium');
  };

  // 왕의 편지 읽기: 발송 처리 + 기록 저장
  const readKingLetter = async () => {
    const sentLetter = pendingKingLetter;
    setKingLetterToShow(sentLetter);

    const newHistory = [...kingLetterHistory, {
      content: sentLetter,
      sentAt: new Date().toLocaleString('ko-KR')
    }];

    await saveToFirebase('kingLetterHistory', newHistory);
    await saveToFirebase('pendingKingLetter', '');

    setKingLetterHistory(newHistory);
    setPendingKingLetter('');
    setMode('kingLetter');
  };

  if (mode === 'loading') return <LoadingScreen />;

  return (
    <>
      {saving && <SavingOverlay />}
      {mode === 'auth'       && <AuthScreen onSuccess={() => setMode('intro')} />}
      {mode === 'tutorial'   && (
        <TutorialScreen
          shyFish={fishes.find(f => f.id === 'shy')}
          onComplete={completeTutorial}
          onSendLetter={sendTutorialLetter}
        />
      )}
      {mode === 'intro'      && <IntroScreen userEmail={user?.email} onStart={() => setMode('aquarium')} onAdmin={() => setMode('adminLogin')} onSignOut={signOut} />}
      {mode === 'adminLogin' && <AdminLoginScreen onSuccess={handleAdminLogin} onBack={() => setMode('intro')} />}
      {mode === 'admin'      && (
        <AdminScreen
          messages={messages}
          goalCount={goalCount}
          cycleCount={cycleCount}
          pendingKingLetter={pendingKingLetter}
          kingLetterHistory={kingLetterHistory}
          adminPassword={adminPassword}
          customFishNames={customFishNames}
          firebaseConnected={firebaseConnected}
          onSave={saveToFirebase}
          onExit={() => setMode('intro')}
        />
      )}
      {mode === 'letter'     && selectedFish && <LetterScreen fish={selectedFish} onSend={feedFish} onCancel={() => setMode('aquarium')} />}
      {mode === 'kingLetter' && <KingLetterScreen content={kingLetterToShow} goalCount={goalCount} onBack={() => setMode('aquarium')} />}
      {mode === 'aquarium'   && (
        <AquariumScreen
          fishes={fishes}
          messages={messages}
          cycleCount={cycleCount}
          goalCount={goalCount}
          pendingKingLetter={pendingKingLetter}
          onFishClick={fish => { setSelectedFish(fish); setMode('letter'); }}
          onReadKingLetter={readKingLetter}
          onBack={() => setMode('intro')}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
