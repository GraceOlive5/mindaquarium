<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="apple-mobile-web-app-title" content="마음 어항">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4BA3C3">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="copyright" content="Copyright 2024 hhappyfamilydais. All rights reserved.">
  <meta name="author" content="hhappyfamilydais">
  <meta name="description" content="아이들의 감정 표현을 돕는 감정 어항 앱 - Mind Aquarium">
  <title>마음 어항</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; background:#0d9ecf; }
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    #root { padding-top: var(--sat); padding-bottom: var(--sab); height: 100vh; position: relative; }
    .fixed { padding-top: var(--sat) !important; }

    @keyframes bubble {
      0%{transform:translateY(0) scale(0.9);opacity:0.9} 50%{transform:translateY(-50vh) scale(1.1);opacity:0.7} 100%{transform:translateY(-100vh) scale(1.3);opacity:0}
    }
    .bubble { position:absolute; bottom:-20px; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(200,230,255,0.6)); border-radius:50%; animation:bubble linear infinite; box-shadow:inset -2px -2px 4px rgba(255,255,255,0.5); }
    .fish-click-area { position:absolute; top:25%; left:25%; width:50%; height:50%; cursor:pointer; pointer-events:auto; z-index:1; }

    /* Admin UI */
    .admin-wrap { position:fixed; inset:0; background: linear-gradient(160deg, #0a3d6b 0%, #0d5c8a 40%, #1a7a6e 100%); z-index: 100; overflow-y: auto; }
    .a-input, .a-textarea { width:100%; padding:10px; border-radius:8px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
    .a-btn { padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; border:none; }
    .btn-blue { background:#3b82f6; color:#white; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, set, onValue, push, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, OAuthProvider, signInWithCredential }
    from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const app = initializeApp({
    apiKey:"AIzaSyCQLxHoTcKvS1X7ausB1slF27tZoFvh99o",
    authDomain:"mind-aquarium.firebaseapp.com",
    databaseURL:"https://mind-aquarium-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"mind-aquarium",
    storageBucket:"mind-aquarium.firebasestorage.app",
    messagingSenderId:"812802606438",
    appId:"1:812802606438:web:07fef3f1b4f89e78b3f4a7"
  });
  window._db = getDatabase(app);
  window._auth = getAuth(app);
  window._fa = { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, ref, set, onValue, push, remove, GoogleAuthProvider, signInWithCredential };
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const fa = () => window._fa;
const db = () => window._db;
const auth = () => window._auth;

const DEFAULT_FISHES = [
  { id:'happy',  defaultName:'행복',    image:'mindaquarium_happy.png',  alwaysShow: true },
  { id:'sad',    defaultName:'슬픔',    image:'mindaquarium_fear.png',   alwaysShow: true },
  { id:'anger',  defaultName:'화남',    image:'mindaquarium_angry.png',  alwaysShow: true },
  { id:'shy',    defaultName:'부끄러움',image:'mindaquarium_shy.png',    alwaysShow: true },
  { id:'fun',    defaultName:'',        image:'mindaquarium_fun.png',    alwaysShow: false },
  { id:'secret', defaultName:'',        image:'mindaquarium_secret.png', alwaysShow: false },
  { id:'worry',  defaultName:'',        image:'mindaquarium_worry.png',  alwaysShow: false },
  { id:'love',   defaultName:'',        image:'mindaquarium_new.png',     alwaysShow: false },
];

/* --- UI 컴포넌트들 --- */
function Bubbles({ n=20 }) {
  const items = useMemo(() => Array.from({length:n}).map((_,i) => ({
    id: i, left: Math.random()*100, size: 10+Math.random()*20, delay: i*0.5, dur: 5+Math.random()*5
  })), [n]);
  return items.map(b => (
    <div key={b.id} className="bubble" style={{ left:`${b.left}%`, width:b.size, height:b.size, animationDelay:`${b.delay}s`, animationDuration:`${b.dur}s` }} />
  ));
}

function SwimmingFish({ fish, onClick, index }) {
  const [pos, setPos] = useState({ x: Math.random() * 70, y: 20 + Math.random() * 40 });
  const [dir, setDir] = useState(index % 2 === 0 ? 1 : -1);
  
  useEffect(() => {
    const timer = setInterval(() => {
      setPos(p => {
        let nx = p.x + (dir * 0.5);
        if (nx > 80) { setDir(-1); return { ...p, x: 80 }; }
        if (nx < 0) { setDir(1); return { ...p, x: 0 }; }
        return { ...p, x: nx, y: p.y + (Math.sin(Date.now()/1000)*0.2) };
      });
    }, 50);
    return () => clearInterval(timer);
  }, [dir]);

  return (
    <div style={{ position:'absolute', left:`${pos.x}%`, top:`${pos.y}%`, width:'100px', transition:'top 0.1s linear', zIndex:10 }}>
      <div style={{ transform:`scaleX(${dir})`, cursor:'pointer' }} onClick={() => onClick(fish)}>
        <img src={fish.image} style={{ width:'100%' }} />
        <div style={{ position:'absolute', top:'100%', left:'50%', transform:'translateX(-50%)', color:'#white', fontWeight:'bold', textShadow:'1px 1px 2px #000', fontSize:'12px', whiteSpace:'nowrap' }}>{fish.name}</div>
      </div>
    </div>
  );
}

function AuthScreen({ onUserDetected }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');

  const handleLogin = async () => {
    try {
      await fa().signInWithEmailAndPassword(auth(), email, pw);
    } catch(e) { alert('로그인 실패: ' + e.message); }
  };

  const socialLogin = (type) => {
    if (window.webkit?.messageHandlers?.loginBridge) {
      window.webkit.messageHandlers.loginBridge.postMessage(type);
    } else { alert('앱 환경에서 시도해주세요.'); }
  };

  return (
    <div className="fixed inset-0 bg-sky-500 flex flex-col items-center justify-center p-6 text-white">
      <h1 className="text-4xl font-bold mb-8">마음 어항</h1>
      <input className="a-input text-black" placeholder="이메일" value={email} onChange={e=>setEmail(e.target.value)} />
      <input className="a-input text-black" type="password" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)} />
      <button className="a-btn btn-blue w-full mb-4" onClick={handleLogin}>로그인</button>
      <div className="flex gap-4">
        <button onClick={() => socialLogin('google')} className="bg-white text-black p-2 rounded">Google</button>
        <button onClick={() => socialLogin('apple')} className="bg-black text-white p-2 rounded">Apple</button>
      </div>
    </div>
  );
}

/* --- 메인 App --- */
function App() {
  const [mode, setMode] = useState('loading');
  const [user, setUser] = useState(null);
  const [messages, setMessages] = useState([]);
  const [customFishNames, setCustomFishNames] = useState({});

  // Native 콜백 정의
  useEffect(() => {
    window.nativeLoginSuccess = async (idToken, email, uid) => {
      console.log("Native Login Success:", uid);
      try {
        if (idToken) {
          const credential = fa().GoogleAuthProvider.credential(idToken);
          await fa().signInWithCredential(auth(), credential);
        }
      } catch(e) { console.error("Native Auth Error:", e); }
    };

    const unsub = fa().onAuthStateChanged(auth(), (u) => {
      if (u) {
        setUser(u);
        setMode('aquarium');
      } else {
        setMode('auth');
      }
    });
    return () => unsub();
  }, []);

  // 데이터 로드
  useEffect(() => {
    if (!user) return;
    const userRef = fa().ref(db(), `users/${user.uid}`);
    fa().onValue(userRef, (snap) => {
      const data = snap.val();
      if (data) {
        if (data.messages) setMessages(Object.values(data.messages));
        if (data.customFishNames) setCustomFishNames(data.customFishNames);
      }
    });
  }, [user]);

  const fishes = DEFAULT_FISHES.map(f => ({
    ...f,
    name: customFishNames[f.id] || f.defaultName
  })).filter(f => f.alwaysShow || customFishNames[f.id]);

  if (mode === 'loading') return <div className="bg-sky-600 h-screen flex items-center justify-center text-white">로딩 중...</div>;
  if (mode === 'auth') return <AuthScreen />;

  return (
    <div className="h-screen bg-sky-400 relative overflow-hidden">
      <Bubbles />
      <div className="absolute top-4 left-4 z-50 text-white font-bold text-lg">
        마음 어항 🐠
      </div>
      
      {fishes.map((f, i) => (
        <SwimmingFish 
          key={f.id} 
          fish={f} 
          index={i} 
          onClick={(fish) => alert(fish.name + " 물고기를 선택했습니다.")} 
        />
      ))}

      <div className="absolute bottom-10 left-0 right-0 flex justify-center gap-4 z-50">
        <button className="bg-white/20 p-3 rounded-full" onClick={() => auth().signOut()}>로그아웃</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
