<script type="text/babel">
const { useState, useEffect, useRef } = React;
const fa = () => window._fa;
const db = () => window._db;
const auth = () => window._auth;

const DEFAULT_FISHES = [
  // 기본 분양 4마리 (항상 어항에 있음)
  { id:'happy',  defaultName:'행복',    color:'하얀색', image:'mindaquarium_happy.png',  alwaysShow: true },
  { id:'sad',    defaultName:'슬픔',    color:'파란색', image:'mindaquarium_fear.png',   alwaysShow: true },
  { id:'anger',  defaultName:'화남',    color:'빨간색', image:'mindaquarium_angry.png',  alwaysShow: true },
  { id:'shy',    defaultName:'부끄러움',color:'핑크색', image:'mindaquarium_shy.png',    alwaysShow: true },
  // 추가 분양 4마리 (이름 입력 시에만 어항에 나옴)
  { id:'fun',    defaultName:'',        color:'초록색', image:'mindaquarium_fun.png',    alwaysShow: false },
  { id:'secret', defaultName:'',        color:'보라색', image:'mindaquarium_secret.png', alwaysShow: false },
  { id:'worry',  defaultName:'',        color:'노란색', image:'mindaquarium_worry.png',  alwaysShow: false },
  { id:'love',   defaultName:'',        color:'주황색', image:'mindaquarium_new.png',   alwaysShow: false },
];

/* ── 공통 컴포넌트 ── */
function Bubble({ delay, left, size, duration }) {
  return <div className="bubble" style={{ left:`${left}%`, width:`${size}px`, height:`${size}px`, animationDelay:`${delay}s`, animationDuration:`${duration}s` }} />;
}

function Bubbles({ n=25 }) {
  const bubbles = React.useMemo(() =>
    Array.from({length:n}).map((_,i) => ({
      delay: i*0.8,
      left: Math.random()*100,
      size: 15+Math.random()*25,
      duration: 8+Math.random()*4
    }))
  , [n]);
  return bubbles.map((b,i) => <Bubble key={i} {...b} />);
}

function SwimmingFish({ fish, onClick, index }) {
  const SCREEN_BOTTOM_LIMIT = 0.62; // 화면 68% 아래로 내려가지 않음
  const speeds = [0.08, 0.02, 0.01, 0.06, 0.03, 0.09, 0.10, 0.07, 0.04];
  const initPositions = [
    {x:0.10, y:0.15}, {x:0.80, y:0.18}, {x:0.50, y:0.30},
    {x:0.15, y:0.45}, {x:0.70, y:0.45}, {x:0.35, y:0.60},
    {x:0.65, y:0.60}, {x:0.25, y:0.35}, {x:0.55, y:0.20}
  ];

  const safeIndex = index % initPositions.length;
  const pos = useRef({
    x: initPositions[safeIndex].x,
    y: initPositions[safeIndex].y,
    vx: index % 2 === 0 ? speeds[index] : -speeds[index],
    vy: (Math.random() - 0.5) * 0.3,
  });
  const [renderPos, setRenderPos] = useState({ x: pos.current.x, y: pos.current.y });
  const [dir, setDir] = useState(index % 2 === 0 ? 1 : -1);
  const ref = useRef(null);
  const animRef = useRef(null);
  const lastTime = useRef(null);

  useEffect(() => {
    const tick = (time) => {
      if (!lastTime.current) lastTime.current = time;
      const dt = Math.min((time - lastTime.current) / 16, 3);
      lastTime.current = time;

      const p = pos.current;
      const fishW = 0.15; // 물고기 너비 비율
      const fishH = 0.15;

      p.x += p.vx * dt * 0.01;
      p.y += p.vy * dt * 0.01;

      // 좌우 경계
      if (p.x <= 0.02) {
        p.x = 0.02;
        p.vx = Math.abs(p.vx);
        setDir(1);
      } else if (p.x >= 1 - fishW - 0.02) {
        p.x = 1 - fishW - 0.02;
        p.vx = -Math.abs(p.vx);
        setDir(-1);
      }

      // 상하 경계 (저작권 표기 위까지만)
      if (p.y <= 0.10) {
        p.y = 0.10;
        p.vy = Math.abs(p.vy) * 0.8 + 0.05;
      } else if (p.y >= SCREEN_BOTTOM_LIMIT - fishH) {
        p.y = SCREEN_BOTTOM_LIMIT - fishH;
        p.vy = -(Math.abs(p.vy) * 0.8 + 0.05);
      }

      // 가끔 방향 살짝 바꿈
      if (Math.random() < 0.005) p.vy += (Math.random() - 0.5) * 0.1;
      p.vy = Math.max(-0.15, Math.min(0.15, p.vy));

      setRenderPos({ x: p.x, y: p.y });
      animRef.current = requestAnimationFrame(tick);
    };

    animRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(animRef.current);
  }, []);

  const size = 'min(148px, 30vw)';

  return (
    <div ref={ref} style={{
      position:'absolute',
      left: `${renderPos.x * 100}%`,
      top: `${renderPos.y * 100}%`,
      width: size, height: size,
      zIndex: 30,
      filter:'drop-shadow(0 4px 8px rgba(0,0,0,0.2))',
      userSelect:'none'
    }}>
      {/* 물고기 이미지 - 방향 전환 */}
      <div style={{ width:'100%', height:'100%', position:'relative', transform:`scaleX(${-dir})` }}>
        <div className="fish-click-area" onClick={onClick} />
        <img src={fish.image} alt={fish.name} style={{userSelect:'none', width:'100%', height:'100%', objectFit:'contain'}} />
      </div>
      {/* 이름 - 몸통 중앙, 항상 정방향 */}
     <div style={{
        position:'absolute',
        top:'50%',
...(dir === -1
          ? { left:'60%', right:'auto' }
          : { right:'60%', left:'auto' }),
        transform:'translateY(-50%)',

      }}>

}

};

const EMOTION_COLORS = Object.fromEntries(
  Object.entries(EMOTION_GRADIENT).map(([k, v]) => [k, v[0]])
);

function getEmotionGradient(name, deg = 135) {
  const colors = EMOTION_GRADIENT[name] || ["#888", "#666"];
  return `linear-gradient(${deg}deg, ${colors.join(", ")})`;
}

  boxShadow: "inset 0 1px 3px rgba(255,255,255,0.7), inset 0 -2px 4px rgba(100,170,210,0.3)",
};

function alphaColor(hex, a) {
  const h = hex.replace("#","");
  const [r,g,b] = [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
  return `rgba(${r},${g},${b},${a})`;
}

  const maxFish = isPaid ? 8 : 4;

    if (emotionFishConfig?.initialized) {

          .map(e => e.id)

    if (emotionFishConfig?.initialized) {

        EMOTIONS_LIST
          .filter(e => (emotionFishConfig.active || []).includes(e.name))
          .map(e => e.id)
      ));
    }

    const activeNames = EMOTIONS_LIST
      .filter(e => nextSet.has(e.id))
      .map(e => e.name);
    await onSave('emotionFishConfig', { active: activeNames, initialized: true });

    const next = new Set(active);
    if (next.has(id)) {

      next.add(id);
    }

/* ── FishNameEditor: 독립 컴포넌트 ── */
function FishNameEditor({ customFishNames, isPaid, onSave }) {
  const [names, setNames] = useState({});
  useEffect(() => { if (customFishNames) setNames(customFishNames); }, [customFishNames]);
  const change = (id, v) => { if (v.length <= 4) setNames(n => ({...n, [id]:v})); };
  const val = (f) => names[f.id] !== undefined ? names[f.id] : f.defaultName;

  const basicFishes = DEFAULT_FISHES.filter(f => f.alwaysShow);
  const extraFishes = DEFAULT_FISHES.filter(f => !f.alwaysShow);

  const handleSave = () => {
    // 기본 4마리 중 이름이 비어있는 게 있는지 체크
    const emptyBasic = basicFishes.filter(f => val(f).trim() === '');
    if (emptyBasic.length > 0) {
      alert('어항에 최소 4마리는 있어야 해요.\n기본 물고기 이름을 모두 입력해주세요.');
      return;
    }
    // 전체 이름 있는 물고기가 4마리 미만인지 체크
    const allNamed = DEFAULT_FISHES.filter(f => val(f).trim() !== '');
    if (allNamed.length < 4) {
      alert('어항에 최소 4마리는 있어야 해요.');
      return;
    }
    onSave(names);
  };

  const FishCard = (f) => (
    <div key={f.id} style={{
      display:'flex', flexDirection:'column', alignItems:'center',
      background: f.alwaysShow ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.07)',
      borderRadius:'12px', padding:'10px 6px',
      border: f.alwaysShow ? '1px solid rgba(255,255,255,0.25)' : '1px dashed rgba(255,255,255,0.2)'
    }}>
      <img src={f.image} alt={f.color} style={{ width:'48px', height:'48px', objectFit:'contain', marginBottom:'4px',
        opacity: val(f).trim() === '' && !f.alwaysShow ? 0.4 : 1
      }} />
      <p style={{ fontSize:'10px', color:'rgba(255,255,255,0.6)', margin:'0 0 6px', textAlign:'center' }}>{f.color}</p>
      <input type="text" maxLength={4}
        value={val(f)}
        onChange={e => change(f.id, e.target.value)}
        placeholder={f.alwaysShow ? '필수' : '이름 입력'}
        style={{
          width:'100%', padding:'5px 4px', fontSize:'13px', fontWeight:700,
          textAlign:'center', borderRadius:'6px',
          border: val(f).trim() === '' && f.alwaysShow
            ? '1px solid rgba(255,100,100,0.6)'
            : val(f).trim() === '' && !f.alwaysShow
            ? '1px dashed rgba(255,255,255,0.3)'
            : '1px solid rgba(255,255,255,0.2)',
          background:'rgba(255,255,255,0.15)', color:'#fff', outline:'none', boxSizing:'border-box'
        }} />
      <p style={{ fontSize:'10px', color:'rgba(255,255,255,0.4)', margin:'3px 0 0' }}>
        {val(f).length}/4
      </p>
    </div>
  );

  const activeExtra = extraFishes.filter(f => val(f).trim() !== '').length;

  return (
    <div>
      {/* 기본 분양 */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'6px' }}>
        <p style={{ fontSize:'13px', color:'rgba(255,255,255,0.9)', fontWeight:600, margin:0 }}>
          기본 물고기 (필수 4마리)
        </p>
        <span style={{ fontSize:'11px', color:'rgba(255,255,255,0.5)' }}>이름 변경 가능</span>
      </div>
      <p style={{ fontSize:'12px', color:'rgba(255,255,255,0.55)', marginBottom:'10px', lineHeight:'1.6' }}>
        어항에는 항상 최소 4마리가 있어야 해요. 이름을 바꾸면 오늘부터의 기록은 새 이름으로 쌓여요.
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'8px', marginBottom:'20px' }}>
        {basicFishes.map(f => FishCard(f))}
      </div>

      {/* 추가 분양 */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'6px' }}>
        <p style={{ fontSize:'13px', color:'rgba(255,255,255,0.9)', fontWeight:600, margin:0 }}>
          추가 분양 물고기 ({activeExtra}/4)
        </p>
        <span style={{ fontSize:'11px', color:'rgba(255,255,255,0.5)' }}>최대 8마리까지</span>
      </div>
      <p style={{ fontSize:'12px', color:'rgba(255,255,255,0.55)', marginBottom:'10px', lineHeight:'1.6' }}>
        어항에는 최대 8마리까지 키울 수 있어요. 처음엔 4마리로 시작하고, 이름을 입력하면 어항에 새로 분양돼요.<br/>
        아이에게 자주 나타나는 감정으로 이름을 지어주세요. 이름을 지웠다가 새로 입력하면 새 감정 물고기로 재분양됩니다.
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'8px', marginBottom:'14px' }}>
        {extraFishes.map(f => FishCard(f))}
      </div>

      <div style={{ display:'flex', gap:'8px' }}>
        <button onClick={handleSave} className="a-btn btn-blue" style={{ flex:1 }}>이름 저장</button>
        <button onClick={() => { setNames({}); onSave({}); }} className="a-btn btn-gray">기본값으로</button>
      </div>
    </div>
  );
}

function AuthScreen({ onSuccess }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [childName, setChildName] = useState('');
  const [busy, setBusy] = useState(false);

  const signIn = async () => {
    if (!email||!password) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
    setBusy(true);
    try {
      await fa().signInWithEmailAndPassword(auth(), email, password);
      onSuccess();
    } catch(e) {
      alert(e.code==='auth/user-not-found'||e.code==='auth/wrong-password' ? '이메일 또는 비밀번호가 잘못되었습니다.' : '로그인 실패: '+e.message);
    } finally { setBusy(false); }
  };

  const signUp = async () => {
    if (!email||!password) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
    if (password !== confirm) { alert('비밀번호가 일치하지 않습니다.'); return; }
    if (password.length < 6) { alert('비밀번호는 6자 이상이어야 합니다.'); return; }
    if (!childName) { alert('아이 이름을 입력해주세요.'); return; }
    setBusy(true);
    try {
      const cred = await fa().createUserWithEmailAndPassword(auth(), email, password);
      await fa().set(fa().ref(db(), `users/${cred.user.uid}/profile`), { email, childName, createdAt: new Date().toISOString() });
      // alert 제거 - onAuthStateChanged가 자동으로 처리
    } catch(e) {
      alert(e.code==='auth/email-already-in-use'?'이미 사용 중인 이메일입니다.':'회원가입 실패: '+e.message);
    } finally { setBusy(false); }
  };

  // 1. 네이티브 앱에 로그인 창 요청
  const startNativeSignIn = (providerName) => {
    setBusy(true);
    if (window.webkit?.messageHandlers?.loginBridge) {
      sessionStorage.setItem('pendingProvider', providerName);
      window.webkit.messageHandlers.loginBridge.postMessage(providerName);
    } else {
      setBusy(false);
      alert('앱 환경에서 시도해주세요.');
    }
  };

  // 2. Swift가 로그인 성공 후 토큰 전달
  useEffect(() => {
window.nativeLoginSuccess = async (customToken) => {
  console.log('nativeLoginSuccess 호출됨');
  try {
    const result = await window._fa.signInWithCustomToken(window._auth, customToken);
    console.log('✅ signInWithCustomToken 성공:', result.user.uid);
    setBusy(false);
  } catch(e) {
    console.error('❌ nativeLoginSuccess 에러:', e.code, e.message);
    setBusy(false);
    alert('로그인 연동 중 오류: ' + e.message);
  }
};
  }, []);

  return (
    <div className="min-h-screen bg-gradient-to-b from-blue-200 to-blue-400 flex items-center justify-center p-4">
      {busy && <LoadingOverlay />}
      <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
        <div className="text-center mb-6">
          <h1 className="text-3xl font-bold text-blue-600 mb-2">🐠 마음 어항 🐠</h1>
          <p className="text-gray-600">{isSignUp ? '새 계정 만들기' : '로그인'}</p>
        </div>
        <div className="space-y-4">
          {isSignUp && <>
            <div>
              <label className="block text-sm font-bold mb-1 text-gray-700">아이 이름</label>
              <input type="text" value={childName} onChange={e=>setChildName(e.target.value)} placeholder="예: 민수"
                className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
            </div>
          </>}
          <div>
            <label className="block text-sm font-bold mb-1 text-gray-700">이메일</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com"
              className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
          </div>
          <div>
            <label className="block text-sm font-bold mb-1 text-gray-700">비밀번호</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder={isSignUp?'6자 이상':'비밀번호'}
              className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
          </div>
          {isSignUp && <div>

            <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="비밀번호 다시 입력"
              className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />

          <button onClick={isSignUp ? signUp : signIn}

function TypeWriter({ text, speed=40, onDone }) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  useEffect(() => {
    setDisplayed('');
    setDone(false);
    let i = 0;
    const id = setInterval(() => {
      i++;
      setDisplayed(text.slice(0, i));
      if (i >= text.length) { clearInterval(id); setDone(true); if(onDone) onDone(); }
    }, speed);
    return () => clearInterval(id);
  }, [text]);
  return <span>{displayed}{!done && <span className="cursor-blink" />}</span>;
}

/* ══════════════════════════════════════
   앱 루트: mode state + Firebase만 관리
══════════════════════════════════════ */
function App() {
  const [mode, setMode] = useState('loading');
  const [user, setUser] = useState(null);
  const [saving, setSaving] = useState(false);
  const [firebaseConnected, setFirebaseConnected] = useState(false);

  const [messages, setMessages] = useState([]);
  const [feedingHistory, setFeedingHistory] = useState({});
  const [goalCount, setGoalCount] = useState(30);
  const [pendingKingLetter, setPendingKingLetter] = useState('');
  const [kingLetterHistory, setKingLetterHistory] = useState([]);
  const [adminPassword, setAdminPassword] = useState('1234');
  const [customFishNames, setCustomFishNames] = useState(null);
  const [selectedFish, setSelectedFish] = useState(null);
  const [kingLetterToShow, setKingLetterToShow] = useState('');
  const [tutorialDone, setTutorialDone] = useState(null);
  const [adminSetupDone, setAdminSetupDone] = useState(null);
  const [lastAdminVisitCount, setLastAdminVisitCount] = useState(0);
  const [isPaid, setIsPaid] = useState(false);
const [emotionFishConfig, setEmotionFishConfig] = useState(null);
  
  // cycleCount: 발송된 편지 수 * goalCount 이후 나머지로 계산
  const sentCount = kingLetterHistory.length;
  const cycleCount = messages.length - (sentCount * goalCount);

  const fishes = (() => {
    // emotionFishConfig가 있으면 새 구조 사용
    if (emotionFishConfig?.initialized) {
      const activeNames = emotionFishConfig.active || [];
      const emotionFishes = EMOTIONS_LIST
        .filter(e => activeNames.includes(e.name))
        .map(e => ({ id: e.name, name: e.name, image: e.image }));
      // 비밀 물고기 항상 포함
      const secretFish = { id: 'secret', name: '비밀', image: 'fish_25.png' };
      return [secretFish, ...emotionFishes];
    }
    // 레거시: customFishNames 기반
    return DEFAULT_FISHES.map(f => ({
      ...f,
      name: customFishNames?.[f.id] !== undefined ? customFishNames[f.id] : f.defaultName
    })).filter(f => f.alwaysShow || f.name.trim() !== '');
  })();
  

  useEffect(() => {
  const timeout = setTimeout(() => {
    setMode(prev => prev === 'loading' ? 'auth' : prev);
  }, 8000); // 8초 후에도 응답 없으면 로그인 화면으로

  const unsubscribe = fa().onAuthStateChanged(auth(), u => {
    clearTimeout(timeout);
    console.log('🧪 onAuthStateChanged:', u ? u.uid : null);
    setUser(u);
    if (!u) setMode('auth');
  });
  return () => { unsubscribe(); clearTimeout(timeout); };
}, []);


  useEffect(() => {
    if (!user) return;
    setFirebaseConnected(true);

    // 프로필 없으면 자동 생성 (소셜 로그인 신규 유저 대응)
    fa().onValue(fa().ref(db(), `users/${user.uid}/profile`), async snap => {
      if (!snap.val()) {
        await fa().set(fa().ref(db(), `users/${user.uid}/profile`), {
          email: user.email || '',
          childName: '아이',
          createdAt: new Date().toISOString()
        });
      }
    }, { onlyOnce: true });

    const listen = (path, cb) => fa().onValue(fa().ref(db(), `users/${user.uid}/${path}`), snap => {
      const d = snap.val();
      if (d !== null && d !== undefined) cb(d);
    });
    listen('messages', d => setMessages(Array.isArray(d) ? d.filter(m=>m&&m.id) : Object.values(d).filter(m=>m&&m.id)));
    listen('feedingHistory', setFeedingHistory);
    listen('goalCount', setGoalCount);
    listen('pendingKingLetter', setPendingKingLetter);
    listen('kingLetterHistory', d => {
      if (Array.isArray(d)) setKingLetterHistory(d.filter(Boolean));
      else setKingLetterHistory(Object.values(d).filter(Boolean));
    });
    listen('adminPassword', setAdminPassword);
    listen('customFishNames', setCustomFishNames);
    listen('lastAdminVisitCount', v => setLastAdminVisitCount(v || 0));
    listen('isPaid', v => setIsPaid(!!v));
    listen('emotionFishConfig', setEmotionFishConfig);

    // 관리자 세팅 + 튜토리얼 완료 여부 확인 후 mode 결정
    Promise.all([
      new Promise(r => fa().onValue(fa().ref(db(), `users/${user.uid}/adminSetupDone`), s => r(s.val()), { onlyOnce: true })),
      new Promise(r => fa().onValue(fa().ref(db(), `users/${user.uid}/tutorialDone`),   s => r(s.val()), { onlyOnce: true })),
    ]).then(([adminDone, tutDone]) => {
      setAdminSetupDone(!!adminDone);
      setTutorialDone(!!tutDone);
      if (!adminDone) setMode('adminOnboarding');
      else if (!tutDone) setMode('tutorial');
      else setMode('intro');
    });

    // ── 마이그레이션: 구버전 kingLetter → 새 구조로 한 번만 실행 ──
    fa().onValue(fa().ref(db(), `users/${user.uid}/v2migrated`), snap => {
      if (snap.val()) return;
      const uid = user.uid;
      Promise.all([
        new Promise(r => fa().onValue(fa().ref(db(), `users/${uid}/kingLetter`),         s => r(s.val()), { onlyOnce:true })),
        new Promise(r => fa().onValue(fa().ref(db(), `users/${uid}/hasReadKingLetter`),  s => r(s.val()), { onlyOnce:true })),
      ]).then(([oldKingLetter, hasRead]) => {
        const updates = { v2migrated: true };
        if (oldKingLetter) {
          if (hasRead) {
            updates['kingLetterHistory'] = [{ content: oldKingLetter, sentAt: '(이전 기록)' }];
            updates['pendingKingLetter'] = '';
          } else {
            updates['pendingKingLetter'] = oldKingLetter;
          }
        }
        Object.entries(updates).forEach(([k, v]) =>
          fa().set(fa().ref(db(), `users/${uid}/${k}`), v)
        );
        if (updates['pendingKingLetter'] !== undefined) setPendingKingLetter(updates['pendingKingLetter']);
      });
    }, { onlyOnce: true });
  }, [user]);

  const saveToFirebase = async (path, data) => {
    if (!user) return;
    setSaving(true);
    try {
      await fa().set(fa().ref(db(), `users/${user.uid}/${path}`), data);
      await new Promise(r => setTimeout(r, 200));
    } catch(e) { alert('저장 실패: '+e.message); }
    finally { setSaving(false); }
  };

  const signOut = async () => {
    if (!confirm('로그아웃 하시겠습니까?')) return;
    await fa().signOut(auth());
    setMessages([]); setFeedingHistory({});
    setPendingKingLetter(''); setKingLetterHistory([]);
    setCustomFishNames(null);
    setMode('auth');
  };

  const completeAdminOnboarding = async (pw) => {
    await saveToFirebase('adminPassword', pw);
    await saveToFirebase('adminSetupDone', true);
    setAdminSetupDone(true);
    setAdminPassword(pw);
    // 세팅 완료 후 튜토리얼로
    setMode('tutorial');
  };

  const completeTutorial = async () => {
    await saveToFirebase('tutorialDone', true);
    setTutorialDone(true);
    setMode('intro');
  };

  const sendTutorialLetter = async (text, fishName) => {
    const updated = [...messages, {
  id: Date.now(),
  fish: fishName,
  content: text,
  date: new Date().toLocaleString('ko-KR'),
  timestamp: Date.now()
}];
    const today = new Date().toISOString().split('T')[0];
    const updatedHistory = { ...feedingHistory, [today]: true };
    await saveToFirebase('messages', updated);
    await saveToFirebase('feedingHistory', updatedHistory);
    setMessages(updated);
    setFeedingHistory(updatedHistory);
  };

  const handleAdminLogin = async (pw) => {
    if (pw === adminPassword) {
      // 관리센터 출근 — 현재 편지 수 저장 (어항 정화)
      await saveToFirebase('lastAdminVisitCount', messages.length);
      setLastAdminVisitCount(messages.length);
      setMode('admin');
    } else {
      alert('비밀번호가 틀렸습니다.');
    }
  };

  const feedFish = async (text) => {
   const updated = [...messages, { id:Date.now(), fish:selectedFish.name, content:text, date:new Date().toLocaleString('ko-KR'), timestamp:Date.now() }];
    const today = new Date().toISOString().split('T')[0];
    const updatedHistory = { ...feedingHistory, [today]: true };

    await saveToFirebase('messages', updated);
    await saveToFirebase('feedingHistory', updatedHistory);
    setMessages(updated);
    setFeedingHistory(updatedHistory);
    setMode('aquarium');
  };

  // 왕의 편지 읽기: 발송 처리 + 기록 저장
  const readKingLetter = async () => {
    const sentLetter = pendingKingLetter;
    setKingLetterToShow(sentLetter);

    const newHistory = [...kingLetterHistory, {
      content: sentLetter,
      sentAt: new Date().toLocaleString('ko-KR')
    }];

    await saveToFirebase('kingLetterHistory', newHistory);
    await saveToFirebase('pendingKingLetter', '');

    setKingLetterHistory(newHistory);
    setPendingKingLetter('');
    setMode('kingLetter');
  };

  if (mode === 'loading') return <LoadingScreen />;

  return (
    <>
      {saving && <SavingOverlay />}
      {mode === 'auth'            && <AuthScreen onSuccess={() => setMode('loading')} />}
      {mode === 'adminOnboarding' && <AdminOnboardingScreen onComplete={completeAdminOnboarding} />}
      {mode === 'tutorial'        && (
        <TutorialScreen
          shyFish={fishes.find(f => f.id === 'shy')}
          onComplete={completeTutorial}
          onSendLetter={sendTutorialLetter}
        />
      )}
      {mode === 'intro'      && <IntroScreen userEmail={user?.email} onStart={() => setMode('aquarium')} onAdmin={() => setMode('adminLogin')} onSignOut={signOut} />}
      {mode === 'adminLogin' && <AdminLoginScreen onSuccess={handleAdminLogin} onBack={() => setMode('intro')} onResetPw={async () => {
        if (confirm('비밀번호를 0000으로 초기화할까요?\n본인 확인을 위해 재로그인이 필요해요.')) {
          await saveToFirebase('adminPassword', '0000');
          setAdminPassword('0000');
          alert('비밀번호가 0000으로 초기화되었습니다.');
        }
      }} />}
      {mode === 'admin'      && (
        <AdminScreen
          messages={messages}
          goalCount={goalCount}
          cycleCount={cycleCount}
          pendingKingLetter={pendingKingLetter}
          kingLetterHistory={kingLetterHistory}
          adminPassword={adminPassword}
          customFishNames={customFishNames}
          firebaseConnected={firebaseConnected}
          onSave={saveToFirebase}
          isPaid={isPaid}
          emotionFishConfig={emotionFishConfig}
          onExit={() => setMode('intro')}
        />
      )}
      {mode === 'letter'     && selectedFish && <LetterScreen fish={selectedFish} onSend={feedFish} onCancel={() => setMode('aquarium')} />}
      {mode === 'kingLetter' && <KingLetterScreen content={kingLetterToShow} goalCount={goalCount} onBack={() => setMode('aquarium')} />}
      {mode === 'aquarium'   && (
        <AquariumScreen
          fishes={fishes}
          messages={messages}
          cycleCount={cycleCount}
          goalCount={goalCount}
          pendingKingLetter={pendingKingLetter}
          lastAdminVisitCount={lastAdminVisitCount}
          onFishClick={fish => { setSelectedFish(fish); setMode('letter'); }}
          onReadKingLetter={readKingLetter}
          onBack={() => setMode('intro')}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/mindaquarium/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
