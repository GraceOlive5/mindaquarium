  const app = initializeApp({

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const fa = () => window._fa;
const db = () => window._db;
const auth = () => window._auth;

const DEFAULT_FISHES = [
  { id:'worry',  defaultName:'걱정',    color:'노란색', image:'mindaquarium_worry.png' },
  { id:'fear',   defaultName:'무서움',  color:'파란색', image:'mindaquarium_fear.png' },
  { id:'anger',  defaultName:'화남',    color:'빨간색', image:'mindaquarium_angry.png' },
  { id:'secret', defaultName:'비밀',    color:'보라색', image:'mindaquarium_secret.png' },
  { id:'fun',    defaultName:'재미',    color:'초록색', image:'mindaquarium_fun.png' },
  { id:'shy',    defaultName:'부끄러움',color:'핑크색', image:'mindaquarium_shy.png' },
  { id:'happy',  defaultName:'행복',    color:'하얀색', image:'mindaquarium_happy.png' },
];

/* ── 공통 컴포넌트 ── */
function Bubble({ delay, left, size }) {
  return <div className="bubble" style={{ left:`${left}%`, width:`${size}px`, height:`${size}px`, animationDelay:`${delay}s`, animationDuration:`${8+Math.random()*4}s` }} />;
}

function Bubbles({ n=25 }) {
  return Array.from({length:n}).map((_,i) =>
    <Bubble key={i} delay={i*0.8} left={Math.random()*100} size={15+Math.random()*25} />
  );
}

function SwimmingFish({ fish, onClick, index }) {
  const [dir, setDir] = useState(1);
  const ref = useRef(null);
  const durations = [18,15,20,17,14,19,16];
  const starts = [
    {top:'15%',left:'10%'},{top:'15%',right:'10%'},{top:'30%',left:'50%'},
    {top:'45%',left:'15%'},{top:'45%',right:'15%'},{top:'60%',left:'35%'},{top:'60%',right:'30%'}
  ];
  useEffect(() => {
    const id = setInterval(() => {
      if (!ref.current) return;
      const r = ref.current.getBoundingClientRect();
      if (r.left <= 0) setDir(1);
      else if (r.right >= window.innerWidth) setDir(-1);
    }, 100);
    return () => clearInterval(id);
  }, []);
  return (
    <div ref={ref} className="fish-swimming absolute" style={{
      ...starts[index], animation:`swim${index+1} ${durations[index]}s ease-in-out infinite`,
      width:'min(120px,25vw)', height:'min(120px,25vw)', zIndex:30
    }}>
      <div style={{ transform:`scaleX(${dir})`, width:'100%', height:'100%', position:'relative' }}>
        <div className="fish-click-area" onClick={onClick} />
        <img src={fish.image} alt={fish.name} style={{userSelect:'none'}} />
        <div className="absolute top-1/2 left-1/2 pointer-events-none" style={{ transform:`translate(-50%,-50%) scaleX(${dir})` }}>
          <span className="text-white text-sm font-bold" style={{ textShadow:'2px 2px 4px rgba(0,0,0,0.8),-1px -1px 2px rgba(0,0,0,0.5)' }}>
            {fish.name}
          </span>
        </div>
      </div>
    </div>
  );
}

/* ── AdminSection: 독립 컴포넌트, 절대 다른 함수 안에 정의하지 않음 ── */
function AdminSection({ title, badge, children, defaultOpen=true }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="sec-card">
      <button className="sec-head" onClick={() => setOpen(v => !v)}>
        <span style={{ fontWeight:600, fontSize:'15px', color:'#111827' }}>
          {title}{badge != null && <span className="badge">{badge}</span>}
        </span>
        <span className="sec-arrow" style={{ transform: open ? 'rotate(0deg)' : 'rotate(180deg)' }}>▲</span>
      </button>
      {open && <div className="sec-body">{children}</div>}
    </div>
  );
}

/* ── FishNameEditor: 독립 컴포넌트 ── */
function FishNameEditor({ customFishNames, onSave }) {
  const [names, setNames] = useState({});
  useEffect(() => { if (customFishNames) setNames(customFishNames); }, [customFishNames]);
  const change = (id, v) => { if (v.length <= 4) setNames(n => ({...n, [id]:v})); };
  return (
    <div>
      <p style={{ fontSize:'13px', color:'#9ca3af', marginBottom:'12px' }}>각 물고기 이름을 최대 4글자로 설정하세요.</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
        {DEFAULT_FISHES.map(f => (
          <div key={f.id} style={{ border:'1px solid #e5e7eb', borderRadius:'8px', padding:'10px', display:'flex', alignItems:'center', gap:'10px' }}>
            <img src={f.image} alt={f.color} style={{ width:'44px', height:'44px', objectFit:'contain' }} />
            <div style={{ flex:1 }}>
              <p style={{ fontSize:'11px', color:'#9ca3af', margin:'0 0 3px' }}>{f.color}</p>
              <input type="text" maxLength={4}
                value={names[f.id] !== undefined ? names[f.id] : f.defaultName}
                onChange={e => change(f.id, e.target.value)}
                className="a-input" style={{ padding:'5px 8px', fontSize:'14px', fontWeight:600 }} />
              <p style={{ fontSize:'10px', color:'#d1d5db', margin:'2px 0 0' }}>
                {(names[f.id] !== undefined ? names[f.id] : f.defaultName).length}/4
              </p>
            </div>
          </div>
        ))}
      </div>
      <div style={{ display:'flex', gap:'8px' }}>
        <button onClick={() => onSave(names)} className="a-btn btn-blue" style={{ flex:1 }}>이름 저장</button>
        <button onClick={() => { setNames({}); onSave({}); }} className="a-btn btn-gray">기본값으로</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   화면 컴포넌트들 (각각 독립적)
══════════════════════════════════════ */

function LoadingScreen() {
  return (
    <div className="fixed inset-0 bg-gradient-to-b from-blue-200 to-blue-400 flex items-center justify-center">
      <div className="text-white text-2xl font-bold">마음 어항을 준비하고 있어요...</div>
    </div>
  );
}

function SavingOverlay() {
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
      <div className="bg-white rounded-lg p-8 flex flex-col items-center">
        <div className="animate-spin text-4xl">⏳</div>
        <p className="text-lg font-bold mt-4">저장하는 중...</p>
      </div>
    </div>
  );
}

function AuthScreen({ onSuccess }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [childName, setChildName] = useState('');
  const [busy, setBusy] = useState(false);

  const signIn = async () => {
    if (!email||!password) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
    setBusy(true);
    try {
      await fa().signInWithEmailAndPassword(auth(), email, password);
      onSuccess();
    } catch(e) {
      alert(e.code==='auth/user-not-found'||e.code==='auth/wrong-password' ? '이메일 또는 비밀번호가 잘못되었습니다.' : '로그인 실패: '+e.message);
    } finally { setBusy(false); }
  };

  const signUp = async () => {
    if (!email||!password) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
    if (password !== confirm) { alert('비밀번호가 일치하지 않습니다.'); return; }
    if (password.length < 6) { alert('비밀번호는 6자 이상이어야 합니다.'); return; }
    if (!childName) { alert('아이 이름을 입력해주세요.'); return; }
    setBusy(true);
    try {
      const cred = await fa().createUserWithEmailAndPassword(auth(), email, password);
      await fa().set(fa().ref(db(), `users/${cred.user.uid}/profile`), { email, childName, createdAt: new Date().toISOString() });
      await fa().set(fa().ref(db(), `users/${cred.user.uid}/adminPassword`), '1234');
      alert('회원가입 완료!');
      onSuccess();
    } catch(e) {
      alert(e.code==='auth/email-already-in-use'?'이미 사용 중인 이메일입니다.':'회원가입 실패: '+e.message);
    } finally { setBusy(false); }
  };

  const googleSignIn = async () => {
    setBusy(true);
    try {
      const provider = new fa().GoogleAuthProvider();
      const result = await fa().signInWithPopup(auth(), provider);
      const uid = result.user.uid;
      const snap = await new Promise(r => fa().onValue(fa().ref(db(),`users/${uid}/profile`), r, {onlyOnce:true}));
      if (!snap.val()) {
        await fa().set(fa().ref(db(),`users/${uid}/profile`), { email: result.user.email, childName:'아이', createdAt: new Date().toISOString() });
        await fa().set(fa().ref(db(),`users/${uid}/adminPassword`), '1234');
      }
      onSuccess();
    } catch(e) { alert('Google 로그인 실패: '+e.message); }
    finally { setBusy(false); }
  };

  return (
    <div className="min-h-screen bg-gradient-to-b from-blue-200 to-blue-400 flex items-center justify-center p-4">
      {busy && <SavingOverlay />}
      <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
        <div className="text-center mb-6">
          <h1 className="text-3xl font-bold text-blue-600 mb-2">🐠 마음 어항 🐠</h1>
          <p className="text-gray-600">{isSignUp ? '새 계정 만들기' : '로그인'}</p>
        </div>
        <div className="space-y-4">
          {isSignUp && <>
            <div>
              <label className="block text-sm font-bold mb-1 text-gray-700">아이 이름</label>
              <input type="text" value={childName} onChange={e=>setChildName(e.target.value)} placeholder="예: 민수"
                className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
            </div>
          </>}
          <div>
            <label className="block text-sm font-bold mb-1 text-gray-700">이메일</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com"
              className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
          </div>
          <div>
            <label className="block text-sm font-bold mb-1 text-gray-700">비밀번호</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder={isSignUp?'6자 이상':'비밀번호'}
              className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
          </div>
          {isSignUp && <div>
            <label className="block text-sm font-bold mb-1 text-gray-700">비밀번호 확인</label>
            <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="비밀번호 다시 입력"
              className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none" />
          </div>}
          <button onClick={isSignUp ? signUp : signIn}
            className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
            {isSignUp ? '회원가입' : '로그인'}
          </button>
          <div className="relative my-2">
            <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-300"/></div>
            <div className="relative flex justify-center text-sm"><span className="px-2 bg-white text-gray-500">또는</span></div>
          </div>
          <button onClick={googleSignIn}
            className="w-full bg-white border-2 border-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-50 transition flex items-center justify-center gap-2">
            <svg className="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google로 계속하기
          </button>
          <button onClick={() => setIsSignUp(v=>!v)} className="w-full text-blue-600 py-2 text-sm hover:underline">

아이들이 눈치 보지 않고 자유롭게 마음을 가꿀 수 있도록 도와주세요.</div>}

            ))}

          {tab === 'mail' && (
            <AdminSection title="수신 편지함" badge={`${messages.length}개`}>

          {tab === 'fish' && (
            <AdminSection title="물고기 이름 설정">
              <FishNameEditor
                customFishNames={customFishNames}
                onSave={async (names) => { await onSave('customFishNames', names); alert('저장되었습니다!'); }}
              />
            </AdminSection>
          )}

          {/* 👑 왕의 편지 */}

            <AdminSection title="물고기 왕의 편지">
              <div className="sbar">

                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>

          {tab === 'pw' && (
            <AdminSection title="관리자 비밀번호 변경">

              </div>

          )}

          <p style={{ textAlign:'center', color:'#d1d5db', fontSize:'11px', marginTop:'2rem' }}>© 2024 Grace. All rights reserved. · v1.0</p>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   앱 루트: mode state + Firebase만 관리
══════════════════════════════════════ */
function App() {
  const [mode, setMode] = useState('loading');
  const [user, setUser] = useState(null);
  const [saving, setSaving] = useState(false);
  const [firebaseConnected, setFirebaseConnected] = useState(false);

  const [messages, setMessages] = useState([]);
  const [feedingHistory, setFeedingHistory] = useState({});
  const [kingLetterContent, setKingLetterContent] = useState('');
  const [hasReadKingLetter, setHasReadKingLetter] = useState(false);
  const [adminPassword, setAdminPassword] = useState('1234');
  const [customFishNames, setCustomFishNames] = useState(null);
  const [selectedFish, setSelectedFish] = useState(null);

  const fishes = DEFAULT_FISHES.map(f => ({ ...f, name: customFishNames?.[f.id] || f.defaultName }));

  useEffect(() => {
    fa().onAuthStateChanged(auth(), u => {
      setUser(u);
      setMode(u ? 'intro' : 'auth');
    });
  }, []);

  useEffect(() => {
    if (!user) return;
    setFirebaseConnected(true);
    const listen = (path, cb) => fa().onValue(fa().ref(db(), `users/${user.uid}/${path}`), snap => {
      const d = snap.val();
      if (d !== null && d !== undefined) cb(d);
    });
    listen('messages', d => setMessages(Array.isArray(d) ? d.filter(m=>m&&m.id) : Object.values(d).filter(m=>m&&m.id)));
    listen('feedingHistory', setFeedingHistory);
    listen('kingLetter', setKingLetterContent);
    listen('hasReadKingLetter', setHasReadKingLetter);
    listen('adminPassword', setAdminPassword);
    listen('customFishNames', setCustomFishNames);
  }, [user]);

  const saveToFirebase = async (path, data) => {
    if (!user) return;
    setSaving(true);
    try {
      await fa().set(fa().ref(db(), `users/${user.uid}/${path}`), data);
      await new Promise(r => setTimeout(r, 200));
    } catch(e) { alert('저장 실패: '+e.message); }
    finally { setSaving(false); }
  };

  const signOut = async () => {
    if (!confirm('로그아웃 하시겠습니까?')) return;
    await fa().signOut(auth());
    setMessages([]); setFeedingHistory({}); setKingLetterContent('');
    setHasReadKingLetter(false); setCustomFishNames(null);
    setMode('auth');
  };

  const handleAdminLogin = (pw) => {
    if (pw === adminPassword) setMode('admin');
    else alert('비밀번호가 틀렸습니다.');
  };

  const feedFish = async (text) => {
    const updated = [...messages, { id:Date.now(), fish:selectedFish.name, content:text, date:new Date().toLocaleString('ko-KR') }];
    const today = new Date().toISOString().split('T')[0];
    const updatedHistory = { ...feedingHistory, [today]: true };
    await saveToFirebase('messages', updated);
    await saveToFirebase('feedingHistory', updatedHistory);
    setMessages(updated);
    setFeedingHistory(updatedHistory);
    setMode('aquarium');
    if (Object.keys(updatedHistory).length >= 30 && kingLetterContent && !hasReadKingLetter)
      setTimeout(() => alert('🎉 물고기 왕이 편지를 보냈어요!'), 500);
  };

  const readKingLetter = async () => {
    setMode('kingLetter');
    await saveToFirebase('hasReadKingLetter', true);
  };

  if (mode === 'loading') return <LoadingScreen />;

  return (
    <>
      {saving && <SavingOverlay />}
      {mode === 'auth'       && <AuthScreen onSuccess={() => setMode('intro')} />}
      {mode === 'intro'      && <IntroScreen userEmail={user?.email} onStart={() => setMode('aquarium')} onAdmin={() => setMode('adminLogin')} onSignOut={signOut} />}
      {mode === 'adminLogin' && <AdminLoginScreen onSuccess={handleAdminLogin} onBack={() => setMode('intro')} />}
      {mode === 'admin'      && (
        <AdminScreen
          uid={user?.uid}
          messages={messages}
          feedingHistory={feedingHistory}
          kingLetterContent={kingLetterContent}
          hasReadKingLetter={hasReadKingLetter}
          adminPassword={adminPassword}
          customFishNames={customFishNames}
          firebaseConnected={firebaseConnected}
          onSave={saveToFirebase}
          onExit={() => setMode('intro')}
        />
      )}
      {mode === 'letter'     && selectedFish && <LetterScreen fish={selectedFish} onSend={feedFish} onCancel={() => setMode('aquarium')} />}
      {mode === 'kingLetter' && <KingLetterScreen content={kingLetterContent} onBack={() => setMode('aquarium')} />}
      {mode === 'aquarium'   && (
        <AquariumScreen
          fishes={fishes}
          feedingHistory={feedingHistory}
          kingLetterContent={kingLetterContent}
          hasReadKingLetter={hasReadKingLetter}
          onFishClick={fish => { setSelectedFish(fish); setMode('letter'); }}
          onReadKingLetter={readKingLetter}
          onBack={() => setMode('intro')}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
