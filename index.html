    function Bubble({ delay, left, size }) {
      return (
        <div className="bubble" style={{
          left: `${left}%`,
          width: `${size}px`,
          height: `${size}px`,
          animationDelay: `${delay}s`,
          animationDuration: `${8 + Math.random() * 4}s`
        }} />
      );
    }

    function SwimmingFish({ fish, onClick, index }) {
      const [direction, setDirection] = React.useState(1);
      const fishRef = React.useRef(null);
      
      const durations = [18, 15, 20, 17, 14, 19, 16];
      const startPositions = [
        { top: '15%', left: '10%' },
        { top: '15%', right: '10%' },
        { top: '30%', left: '50%' },
        { top: '45%', left: '15%' },
        { top: '45%', right: '15%' },
        { top: '60%', left: '35%' },
        { top: '60%', right: '30%' }
      ];
      
      React.useEffect(() => {
        const checkBoundary = () => {
          if (fishRef.current) {
            const rect = fishRef.current.getBoundingClientRect();
            if (rect.left <= 0) setDirection(1);
            else if (rect.right >= window.innerWidth) setDirection(-1);
          }
        };
        const interval = setInterval(checkBoundary, 100);
        return () => clearInterval(interval);
      }, []);

      return (
        <div ref={fishRef} className="fish-swimming absolute" style={{
          ...startPositions[index],
          animation: `swim${index + 1} ${durations[index]}s ease-in-out infinite`,
          width: 'min(120px, 25vw)',
          height: 'min(120px, 25vw)',
          zIndex: 30
        }}>
          <div style={{ transform: `scaleX(${direction})`, width: '100%', height: '100%', position: 'relative' }}>
            <div className="fish-click-area" onClick={onClick} />
            <img src={fish.image} alt={fish.name} style={{ userSelect: 'none' }} />
            <div className="absolute top-1/2 left-1/2 pointer-events-none" style={{ transform: `translate(-50%, -50%) scaleX(${direction})` }}>
              <span className="text-white text-sm md:text-base font-bold drop-shadow-lg" style={{
                textShadow: '2px 2px 4px rgba(0,0,0,0.8), -1px -1px 2px rgba(0,0,0,0.5)'
              }}>
                {fish.name}
              </span>
            </div>
          </div>
        </div>
      );
    }

  }

function FishNameEditor({ defaultFishes, customFishNames, onSave }) {
  const [editedNames, setEditedNames] = React.useState({});

  React.useEffect(() => {
    if (customFishNames) {
      setEditedNames(customFishNames);
    }
  }, [customFishNames]);

  const handleNameChange = (fishId, newName) => {
    if (newName.length <= 4) {
      setEditedNames({ ...editedNames, [fishId]: newName });
    }
  };

  const handleSave = () => {
    onSave(editedNames);
  };

  const handleReset = () => {
    setEditedNames({});
    onSave({});
  };

  return (
    <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-6 mb-6">
      <h3 className="text-xl font-bold mb-4">🐟 물고기 이름 설정</h3>
      <p className="text-sm text-gray-600 mb-4">각 물고기의 이름을 최대 4글자까지 설정할 수 있습니다.</p>
      
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        {defaultFishes.map(fish => (
          <div key={fish.id} className="bg-white rounded-lg p-4 border-2 border-gray-200">
            <div className="flex items-center gap-3 mb-2">

              <div className="flex-1">
                <p className="text-sm text-gray-600 mb-1">{fish.color} 물고기</p>
                <input
                  type="text"
                  value={editedNames[fish.id] || fish.defaultName}
                  onChange={(e) => handleNameChange(fish.id, e.target.value)}
                  placeholder={fish.defaultName}
                  maxLength={4}
                  className="w-full border-2 border-gray-300 rounded-lg p-2 text-lg font-bold"
                />
                <p className="text-xs text-gray-500 mt-1">
                  {(editedNames[fish.id] || fish.defaultName).length}/4자
                </p>
              </div>
            </div>
          </div>
        ))}
      </div>
      
      <div className="flex gap-3">
        <button
          onClick={handleSave}
          className="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition"
        >
          이름 저장
        </button>
        <button
          onClick={handleReset}
          className="bg-gray-300 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-400 transition"
        >
          기본값으로 되돌리기
        </button>
      </div>
    </div>
  );
}

                onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                placeholder="비밀번호 입력"
                className="w-full border-2 border-gray-300 rounded-lg p-3 mb-4"
              />
              <button onClick={handleAdminLogin} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition mb-3">
                로그인
              </button>
              <button onClick={() => setMode('intro')} className="w-full bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition">
                돌아가기
              </button>
            </div>
          </div>
        );
      }

      
      if (mode === 'admin') {
        const totalDays = getTotalDays();
        const canEditKingLetter = totalDays >= 30 && hasReadKingLetter;
        const hasKingLetter = !!kingLetterContent;

        return (
          <div className="fixed inset-0 bg-gray-100 overflow-hidden">
            <div className="h-full overflow-y-auto">
              <div className="max-w-4xl mx-auto p-6 pb-20">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h2 className="text-3xl font-bold">관리자 모드</h2>
                    {firebaseConnected && <p className="text-sm text-green-600">🔥 실시간 동기화 중</p>}
                  </div>
                  <button onClick={() => setMode('intro')} className="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
                    나가기
                  </button>
                </div>

                {/* 비밀번호 변경 */}
                <div className="bg-red-50 border-2 border-red-300 rounded-lg p-6 mb-6">
                  <h3 className="text-xl font-bold mb-4">🔒 관리자 비밀번호 변경</h3>
                  <div className="space-y-3">
                    <div>
                      <label className="block text-sm font-bold mb-1">새 비밀번호 (4자 이상)</label>
                      <input
                        type="password"
                        value={newPassword}
                        onChange={(e) => setNewPassword(e.target.value)}
                        placeholder="새 비밀번호 입력"
                        className="w-full border-2 border-gray-300 rounded-lg p-3"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold mb-1">비밀번호 확인</label>
                      <input
                        type="password"
                        value={confirmPassword}
                        onChange={(e) => setConfirmPassword(e.target.value)}
                        placeholder="비밀번호 다시 입력"
                        className="w-full border-2 border-gray-300 rounded-lg p-3"
                      />
                    </div>
                    <button
                      onClick={changePassword}
                      className="w-full bg-red-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-red-700 transition"
                    >
                      비밀번호 변경
                    </button>
                  </div>
                </div>

                {/* 물고기 이름 설정 */}
                <FishNameEditor 
                  defaultFishes={defaultFishes}
                  customFishNames={customFishNames}
                  onSave={saveFishNames}
                />

                {/* 물고기 왕의 편지 */}
                <div className="bg-yellow-50 border-2 border-yellow-300 rounded-lg p-6 mb-6">
                  <div className="flex items-center gap-2 mb-4">
                    <Crown />
                    <h3 className="text-xl font-bold">물고기 왕의 편지</h3>
                  </div>
                  
                  <div className="bg-white rounded-lg p-4 mb-4 border-2 border-yellow-200">
                    <p className="text-sm font-bold mb-2">📊 현재 상태:</p>
                    <p className="text-gray-700">• 달성 일수: {totalDays}/30일</p>
                    <p className="text-gray-700">• 저장된 편지: {hasKingLetter ? '있음' : '없음'}</p>
                    <p className="text-gray-700">• 아이가 읽음: {hasReadKingLetter ? '예' : '아니오'}</p>
                    {totalDays >= 30 && !hasReadKingLetter && hasKingLetter && (
                      <p className="text-green-600 font-bold mt-2">✅ 아이가 편지를 받을 수 있습니다!</p>
                    )}
                  </div>

                  {(!hasKingLetter || canEditKingLetter) ? (
                    <>
                      <textarea
                        value={parentLetter}
                        onChange={(e) => setParentLetter(e.target.value)}
                        placeholder="아이에게 보낼 격려의 편지를 작성하세요..."
                        className="w-full border-2 border-gray-300 rounded-lg p-3 mb-3 h-32"
                        maxLength={300}
                      />
                      <div className="flex justify-between items-center">
                        <span className="text-sm text-gray-600">{parentLetter.length}/300자</span>
                        <button
                          onClick={saveKingLetter}
                          className="bg-yellow-500 text-white px-6 py-2 rounded-lg font-bold hover:bg-yellow-600"
                        >
                          편지 저장
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="bg-yellow-100 border-2 border-yellow-400 rounded-lg p-4">
                      <p className="text-sm font-bold mb-2 text-yellow-800">💌 현재 저장된 편지:</p>
                      <p className="text-gray-700 whitespace-pre-wrap mb-3">{kingLetterContent}</p>
                      <p className="text-sm text-yellow-700">
                        ℹ️ 아이가 30일을 달성하고 편지를 읽으면 새로운 편지를 작성할 수 있습니다.
                      </p>
                    </div>
                  )}
                </div>

                {/* 수신 편지함 */}
                <div className="bg-white rounded-lg shadow-lg p-6">
                  <h3 className="text-2xl font-bold mb-4 flex items-center gap-2">
                    <Mail />
                    수신 편지함 ({messages.length}개)
                  </h3>
                  
                  {messages.length === 0 ? (
                    <p className="text-gray-500 text-center py-8">아직 받은 편지가 없습니다.</p>
                  ) : (
                    <div className="space-y-4">
                      {messages.slice().reverse().map((msg) => (
                        <div key={msg.id} className="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-300 transition">
                          <div className="flex justify-between items-start mb-2">
                            <span className="font-bold text-lg">{msg.fish} 물고기</span>
                            <span className="text-sm text-gray-500">{msg.date}</span>
                          </div>
                          <p className="text-gray-700 whitespace-pre-wrap">{msg.content}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                
                <div className="text-center text-gray-500 text-xs mt-8 pb-4">
                  <p>© 2024 Grace. All rights reserved.</p>
                  <p className="mt-1">마음 어항 v1.0</p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (mode === 'letter' && selectedFish) {
        return (
          <div className="min-h-screen bg-gradient-to-b from-blue-200 to-blue-400 p-4 overflow-y-auto">
            <div className="max-w-2xl mx-auto py-4">
              <div className="bg-white rounded-lg shadow-xl p-6">
                <h2 className="text-2xl font-bold mb-3 text-center">{selectedFish.name} 물고기에게 먹이 주기</h2>
                <div className="flex justify-center mb-4">
                  <img src={selectedFish.image} alt={selectedFish.name} className="w-40 h-40 object-contain" />
                </div>
                <p className="text-gray-600 text-center mb-4 text-sm">오늘의 마음을 편지로 써보세요</p>
                
                <textarea
                  value={letterContent}
                  onChange={(e) => setLetterContent(e.target.value)}
                  placeholder={`${selectedFish.name} 물고기에게 하고 싶은 이야기를 써주세요...`}
                  className="w-full border-2 border-gray-300 rounded-lg p-3 mb-3 h-32 text-base"
                  maxLength={100}
                />
                
                <div className="text-right text-sm text-gray-600 mb-4">{letterContent.length}/100자</div>
                
                <div className="flex gap-3">
                  <button
                    onClick={() => { setMode('aquarium'); setLetterContent(''); }}
                    className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition"
                  >
                    취소
                  </button>
                  <button
                    onClick={feedFish}
                    className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2"
                  >
                    <Heart />
                    먹이 주기
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (mode === 'kingLetter') {
        return (
          <div className="min-h-screen bg-gradient-to-b from-yellow-200 to-yellow-400 p-6">
            <div className="max-w-2xl mx-auto">
              <div className="bg-white rounded-lg shadow-xl p-8">
                <div className="text-center mb-6">
                  <div className="text-6xl mb-4"><Crown /></div>
                  <h2 className="text-3xl font-bold mb-2">물고기 왕의 편지</h2>
                  <p className="text-gray-600">30일 동안 물고기들을 돌봐줘서 고마워요!</p>
                </div>
                
                <div className="bg-yellow-50 border-2 border-yellow-300 rounded-lg p-6 mb-6">
                  <p className="text-lg whitespace-pre-wrap leading-relaxed">{kingLetterContent}</p>
                </div>
                
                <button onClick={() => setMode('aquarium')} className="w-full bg-blue-600 text-white py-4 rounded-lg font-bold hover:bg-blue-700 transition">
                  어항으로 돌아가기
                </button>
              </div>
            </div>
          </div>
        );
      }

      const totalDays = getTotalDays();
      const canShowKingLetter = totalDays >= 30 && kingLetterContent && !hasReadKingLetter;

      return (
        <div className="relative min-h-screen overflow-hidden" style={{
          backgroundImage: 'url(mindaquarium_bg.png)',
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          backgroundRepeat: 'no-repeat'
        }}>
          {Array.from({ length: 25 }).map((_, i) => (
            <Bubble key={i} delay={i * 0.8} left={Math.random() * 100} size={15 + Math.random() * 25} />
          ))}

          <div className="relative z-20 text-center pt-4 pb-2">
            <h1 className="text-3xl font-bold text-white mb-2 drop-shadow-lg">🐠 마음 어항 🐠</h1>
            
            <div className="bg-white/90 rounded-lg p-3 inline-block mx-auto max-w-xs">
              <p className="text-xs text-gray-600 mb-1">물고기에게 먹이 준 날</p>
              <div className="flex gap-1 justify-center mb-1 flex-wrap">
                {Array.from({ length: 30 }).map((_, i) => (
                  <div key={i} className={`w-2.5 h-2.5 rounded-full ${i < totalDays ? 'bg-blue-500' : 'bg-gray-300'}`} />
                ))}
              </div>
              <p className="text-xl font-bold text-blue-600">{totalDays} / 30일</p>
            </div>
          </div>

          {canShowKingLetter && (
            <div className="relative z-20 px-6 mb-4">
              <button
                onClick={readKingLetter}
                className="w-full max-w-2xl mx-auto block bg-yellow-400 text-gray-800 py-6 rounded-lg font-bold text-xl hover:bg-yellow-500 transition flex items-center justify-center gap-3 animate-pulse shadow-xl"
              >
                <Crown />
                <span>물고기 왕이 편지를 보냈어요! 📬</span>
              </button>
            </div>
          )}

          <div className="relative w-full h-screen">
            {fishes.map((fish, index) => (
              <SwimmingFish
                key={fish.id}
                fish={fish}
                index={index}
                onClick={() => { setSelectedFish(fish); setMode('letter'); }}
              />
            ))}
          </div>

          <div className="fixed top-6 left-6 z-20">
            <button onClick={() => setMode('intro')} className="bg-white/90 text-blue-600 px-4 py-2 rounded-lg font-bold hover:bg-white transition shadow-lg text-sm">
              ← 처음으로
            </button>
          </div>
          
          <div className="fixed bottom-8 left-0 right-0 z-10 text-center pointer-events-none">
            <p className="text-white/50 text-xs">© 2024 Grace</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MindAquarium />);
  </script>
</body>
</html>
